<style>
/* Layout: cabeçalho fixo · lista de relatórios OU relatório com secções (lateral no PC, faixa no telemóvel) · botão "+ Nota" sempre à mão */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F6F1; --ink:#1B1A17; --muted:#6B675E; --line:#DEDAD0;
  --red:#C00000; --red-ink:#FFFFFF; --gold:#B8963F; --gold-soft:#F4EBD3; --blue:#1F5FBF; --blue-soft:#E3ECF9;
  --ok:#1E7A46; --ok-soft:#E3F2E8; --warn:#A35A00; --warn-soft:#FBEEDB; --shadow:0 1px 2px rgba(27,26,23,.06),0 4px 14px rgba(27,26,23,.06);
  --f-display:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1D1C1A; --surface-2:#252320; --ink:#F1EEE7; --muted:#A39E93; --line:#36332E;
  --red:#E0393A; --red-ink:#FFFFFF; --gold:#D6B262; --gold-soft:#352C18; --blue:#5B8FE0; --blue-soft:#1C2A40;
  --ok:#5BC48A; --ok-soft:#173225; --warn:#E3A44B; --warn-soft:#3A2A12; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1D1C1A; --surface-2:#252320; --ink:#F1EEE7; --muted:#A39E93; --line:#36332E;
  --red:#E0393A; --red-ink:#FFFFFF; --gold:#D6B262; --gold-soft:#352C18; --blue:#5B8FE0; --blue-soft:#1C2A40;
  --ok:#5BC48A; --ok-soft:#173225; --warn:#E3A44B; --warn-soft:#3A2A12; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{width:34px;height:34px;object-fit:contain}
.brand h1{font-size:22px;font-weight:800;line-height:1}
.brand h1 span{color:var(--red)}
.brand small{display:block;font-family:var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;font-size:11.5px;margin-top:2px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--ok)} .status.busy i{background:var(--gold)} .status.local i{background:var(--warn)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:1320px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:42px;display:inline-flex;align-items:center;gap:6px;justify-content:center;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:default}
.banner{border-radius:10px;padding:10px 14px;font-size:14.5px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.banner b{font-weight:700}
/* lista */
.lhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lhead h2{font-size:26px;margin-right:auto}
.lhead p{margin:4px 0 0;color:var(--muted);font-size:14.5px;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.rcard h3{font-size:21px}
.rcard .meta{font-size:13.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap}
.rcard .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:12px;letter-spacing:.6px;text-transform:uppercase;border-radius:999px;padding:3px 9px;font-weight:700;white-space:nowrap}
.chip.rasc{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.env{background:var(--gold-soft);color:var(--warn)}
.chip.rev{background:var(--ok-soft);color:var(--ok)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{font-family:var(--f-display);font-size:20px}
.empty span{color:var(--muted);max-width:60ch}
/* relatório */
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rhead h2{font-size:26px;min-width:0;overflow-wrap:anywhere}
.rhead .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.rgrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
nav.secs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;flex-direction:column;gap:2px}
nav.secs button{border:0;background:transparent;border-radius:8px;padding:8px 10px;min-height:42px;display:flex;align-items:center;gap:8px;text-align:left;font-size:15px}
nav.secs button .c{margin-left:auto;font-family:var(--f-display);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.secs button[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
nav.secs button[aria-current="true"] .c{color:var(--red)}
nav.secs .grp{font-family:var(--f-display);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:10px 0 2px 10px}
@media (max-width:999px){
  .rgrid{grid-template-columns:minmax(0,1fr)}
  nav.secs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;flex-direction:row;overflow-x:auto;gap:6px;background:var(--bg);padding-block:6px;margin-inline:-4px;padding-inline:4px}
  nav.secs .grp{display:none}
  nav.secs button{white-space:nowrap;flex:none;background:var(--surface);border:1px solid var(--line)}
  nav.secs button[aria-current="true"]{border-color:var(--red)}
}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec > header h3{font-size:24px}
.sec > header p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{font-size:17px;line-height:1.25}
.q{gap:8px}
.q .qt{display:flex;gap:10px;align-items:baseline}
.q .qn{font-family:var(--f-display);font-weight:800;color:var(--red);font-size:15px;flex:none;width:24px;font-variant-numeric:tabular-nums}
.q .qt h4{font-weight:700;font-family:var(--f-body);font-size:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:44px;width:100%;min-width:0;color:var(--ink)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.evs{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);text-align:left;width:100%}
.ev .tm{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;min-width:46px}
.ev .tx{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev .tags{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ev .tags a{color:var(--blue);font-weight:600}
.fq{font-family:var(--f-display);font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;border-radius:4px;padding:1px 6px}
.fq.rec{background:var(--ok-soft);color:var(--ok)}
.fq.pont{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.fq.conf{background:var(--warn-soft);color:var(--warn)}
.addev{align-self:flex-start}
.hint{font-size:13.5px;color:var(--muted)}
.prin{display:flex;gap:6px;flex-wrap:wrap}
.prin span{font-family:var(--f-display);font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:12.5px;background:var(--red);color:var(--red-ink);border-radius:4px;padding:3px 8px}
/* campo */
.pitch{background:#fff;border:1px solid #CFCFCF;border-radius:6px;overflow:hidden;touch-action:none;max-width:520px;width:100%;margin:0 auto}
.pitch svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.pitch.half{max-width:680px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.estr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.estr{grid-template-columns:minmax(0,1fr)}}
.bpl{display:flex;flex-direction:column;gap:8px}
.bpi{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:50px;width:100%}
.bpi b{font-family:var(--f-display);font-size:16px}
.bpi span{color:var(--muted);font-size:13.5px;margin-left:auto}
.bpi[aria-expanded="true"]{border-color:var(--red)}
.pl{display:flex;flex-direction:column;gap:10px}
.plh{display:flex;gap:10px;align-items:center}
.plh .num{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--blue);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.three{display:grid;gap:8px}
.three > div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.three > div > b{font-family:var(--f-display);font-size:20px;color:var(--red);text-align:center;padding-top:8px}
.three.op > div > b{color:var(--ok)}
.clip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.cores input[type=color]{width:52px;height:44px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:none}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;min-height:0}
.q.qok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.q.qok .qn{color:var(--ok)}
.qop button{text-align:left}
.qrod{justify-content:space-between;gap:8px}
.qfq button{min-height:40px;padding:4px 12px;font-size:13.5px}
.qac{display:flex;gap:6px;flex-wrap:wrap}
.qjog{gap:6px}
.jchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px;font-weight:600}
.jchip button{border:0;background:transparent;min-height:30px;min-width:30px;color:var(--muted)}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:56vh;overflow:auto}
.pgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left;min-height:58px;display:flex;flex-direction:column;gap:1px}
.pgrid button b{font-family:var(--f-display);font-size:20px;color:var(--blue);line-height:1}
.pgrid button span{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid button small{font-size:11px;color:var(--muted)}
.pgrid button[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.ptab{width:100%;border-collapse:collapse;font-size:14.5px}
.ptab th{text-align:left;font-family:var(--f-display);font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptab td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ptab input[type=text],.ptab select{min-height:40px;padding:6px 8px}
.ptab tr.porconf td:nth-child(3) select{border-color:var(--warn);border-style:dashed}
.rev{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
/* folha (diálogo) */
.sheet-bg{position:fixed;inset:0;background:rgba(15,14,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(620px,100%);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:761px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h3{font-size:22px}
.sheet h4{font-family:var(--f-display);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.actions .l{margin-right:auto}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;min-height:54px;padding:0 20px;border-radius:999px;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14.5px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header class="top"><div class="in">
  <div class="brand"><img src="{{LOGO}}" alt=""><div><h1><span>SCA</span> Observação</h1><small>Observação de adversários</small></div></div>
  <div class="status" id="status" aria-live="polite"><i></i><span>A ligar…</span></div>
</div></header>
<main class="wrap" id="main"></main>
<button class="btn primary fab" id="fab" hidden>+ Nota</button>

<script>

const COMP="Campeonato de Futebol dos Açores", EPOCA="2026/27";
/* equipas do CFA 2026/27 (Açoriano Oriental, 02/09/2026); o SC Angrense não entra na lista de adversários */

const L4=[["GR","1",.5,.035],["LD","2",.10,.25],["DCD","3",.31,.20],["DCE","4",.69,.20],["LE","5",.90,.25]];
const LAYOUTS={

/* plantel base de cada equipa (base/<equipa>): só o Rodrigo escreve, os observadores leem; os relatórios novos partem dele.
   No ecrã é um "relatório" só com o Plantel (base:true), para usar o mesmo editor */

function baseNova(equipa){ const P=plantelZZ(equipa); return normBase({equipa,...(P?{plantel:P.jogadores,plantelFonte:P.fonte,treinador:P.treinador}:{})},slugEq(equipa)); }

  delete daBase.equipa; return normRel({id:nid("r"),autor:meId||"local",adversario:adv||"",competicao:COMP+" "+EPOCA,criadoEm:new Date().toISOString(),...daBase}); }
function relAtual(){ if(vista.tipo==="base") return bases[vista.id]||null; return vista.id&&rels[vista.id]?rels[vista.id]:null; }

/* ======================= gravação com fila (funciona sem rede) ======================= */
let pend=LS(PEND)||{}, pendSeq=0; const filas={};
const salvaPend=()=>LSset(PEND,pend);
function setStatus(k,t){ const s=$("status"); s.className="status "+k; s.querySelector("span").textContent=t; }
function estado(falhou){ if(semDb){ setStatus("local","Guardado só neste aparelho"); return; } if(soLeitura){ setStatus("local","Só leitura"); return; } const n=Object.keys(pend).length;
  if(!n){ setStatus("ok","Guardado"); return; } const off=falhou||navigator.onLine===false; setStatus(off?"local":"busy",(off?"Sem rede · ":"A enviar · ")+n+(n===1?" alteração por enviar":" alterações por enviar")); }
function envia(path){ const P=pend[path]; if(!P||!db||soLeitura) return; const st=P.s;
  filas[path]=(filas[path]||Promise.resolve()).catch(()=>{}).then(()=>{ const c=pend[path]; if(!c||c.s!==st) return; return c.del?db.doc(path).delete():db.doc(path).set({...c.b,atualizadoEm:new Date().toISOString()}); })
    .then(()=>{ if(pend[path]&&pend[path].s===st){ delete pend[path]; salvaPend(); } estado(false); })
    .catch(e=>{ if(e?.code==="invalid_argument"){ soLeitura=true; delete pend[path]; salvaPend(); estado(); render(); return; } estado(true); }); }
function gravaDoc(path,body){ if(semDb||!db) return; pend[path]={s:(++pendSeq)+"-"+Date.now(),b:body}; salvaPend(); estado(false); envia(path); }
function apagaDoc(path){ if(semDb||!db) return; pend[path]={s:(++pendSeq)+"-"+Date.now(),del:true}; salvaPend(); estado(false); envia(path); }
const reenvia=()=>Object.keys(pend).forEach(envia);
addEventListener("online",()=>{ reenvia(); estado(false); }); addEventListener("offline",()=>estado(true));
setInterval(()=>{ if(db&&Object.keys(pend).length) reenvia(); },20000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&db) reenvia(); });

const relPath=R=>`obs/${R.autor}/relatorios/${R.id}`, revPath=R=>`obs/${R.autor}/revisoes/${R.id}`;
const tSave={};
function guardaRel(R,ja){ R.atualizadoEm=new Date().toISOString(); clearTimeout(tSave[R.id]);
  if(R.base){ const s=R.id.slice(5); bases[s]=R; guardaCacheBase(); const f=()=>gravaDoc(`base/${s}`,docBase(bases[s])); if(ja) f(); else tSave[R.id]=setTimeout(f,700); return; }

/* ======================= campo (vertical: x 0–68 m largura, y 0–105 m comprimento) ======================= */
const K=10;
/* campo branco, linhas pretas e balizas cinzentas, como os quadros da SCA Match Center */
function campoSvg(meio){ const L=68*K, C=(meio?36:105)*K, s='stroke="#111" stroke-width="3" fill="none"'; let h="";
  const n=meio?6:18; for(let i=0;i<n;i++) h+=`<rect x="0" y="${i*C/n}" width="${L}" height="${C/n+.5}" fill="${i%2?"#EEEEEE":"#FFFFFF"}"/>`;
  const baliza=top=>{ const y=top?-20:1050; let g=`<rect x="303.4" y="${y}" width="73.2" height="20" fill="#D9D9D9" stroke="#111" stroke-width="2.4"/>`; for(let k=1;k<4;k++) g+=`<line x1="${303.4+k*73.2/4}" y1="${y}" x2="${303.4+k*73.2/4}" y2="${y+20}" stroke="#888" stroke-width="1"/>`; return g; };
  const area=(top)=>{ const y0=top?0:1050, d=top?1:-1, yb=y0+d*165, yg=y0+d*55, sp=y0+d*110;
    h+=`<rect x="138.4" y="${Math.min(y0,yb)}" width="403.2" height="165" ${s}/><rect x="248.4" y="${Math.min(y0,yg)}" width="183.2" height="55" ${s}/>`;
    h+=`<circle cx="340" cy="${sp}" r="3.5" fill="#111"/><path d="M 266.9 ${yb} A 91.5 91.5 0 0 ${top?0:1} 413.1 ${yb}" ${s}/>`+baliza(top); };
  area(true);
  if(!meio){ h+=`<line x1="0" y1="525" x2="${L}" y2="525" ${s}/><circle cx="340" cy="525" r="91.5" ${s}/><circle cx="340" cy="525" r="3.5" fill="#111"/>`; area(false); }
  h+=meio?`<path d="M 0 ${C} L 0 0 L ${L} 0 L ${L} ${C}" stroke="#111" stroke-width="4" fill="none"/>`:`<rect x="0" y="0" width="${L}" height="${C}" stroke="#111" stroke-width="4" fill="none"/>`;
  [[0,0,0,1],[L,0,-1,1]].concat(meio?[]:[[0,C,1,-1],[L,C,-1,-1]]).forEach(([x,y,dx,dy])=>h+=`<path d="M ${x+dx*10} ${y} A 10 10 0 0 ${dx*dy>0?1:0} ${x} ${y+dy*10}" ${s}/>`);
  return h; }
function svgPt(svg,e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse()); return {x:q.x/K,y:q.y/K}; }
const COR={sca:"#C00000",gr:"#FFFF00",out:"#7F7F7F"};

function contraste(h){ const m=String(h||"").match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if(!m) return "#fff"; const [r,g,b]=m.slice(1).map(x=>parseInt(x,16)/255); return .2126*r+.7152*g+.0722*b>.6?"#000":"#fff"; }

/* durante um arrasto, o que chega da base de dados espera: redesenhar a meio soltava a bolinha */
let aArrastar=false;
function fimArrasto(){ aArrastar=false; if(precisaRender) setTimeout(()=>{ if(!aArrastar&&!aEscrever()&&precisaRender){ precisaRender=false; render.mesma=true; render(); } },0); }
function arrasta(svg,{onDown,onMove,onUp}){ let ativo=null;
  svg.addEventListener("pointerdown",e=>{ const r=onDown(e,svgPt(svg,e)); if(r){ ativo=r; aArrastar=true; e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(x){} } });

/* um erro a desenhar nunca deixa a página em branco: mostra o aviso e o caminho de volta */

function render0(){ if(vista.tipo==="base"&&!bases[vista.id]){ const eq=EQUIPAS.find(([n])=>slugEq(n)===vista.id); if(eq) bases[vista.id]=baseNova(eq[0]); }

function contagens(R){ const resp=TODAS_Q.filter(q=>respondida(R,q.id)).length, tot=TODAS_Q.length;

    else h+=`<div class="rcard" style="box-shadow:none;background:var(--surface-2);border-style:dashed"><span class="hint">${esc(ilha)}</span><h3>${esc(n)}</h3><div class="meta">Ainda sem relatório</div>${!soLeitura?`<button class="btn sm" data-novo="${esc(n)}" style="align-self:flex-start">+ Começar observação</button>`:""}</div>`; });

  [$("novo"),$("novo2")].forEach(b=>b&&(b.onclick=()=>cria(""))); $("main").querySelectorAll("[data-novo]").forEach(b=>b.onclick=()=>cria(b.dataset.novo));

/* ---------- plantel do adversário ---------- */
const PLF={VW:1680,fx:40,fy:80,fw:1600,fh:1120,bw:236};
function posicoesPx(lay,cont,xy){ const {fx,fy,fw,fh,bw}=PLF, P={}, ord=lay.slice().sort((a,b)=>a[3]-b[3]); let fundo=fy+fh; xy=xy||{};
  /* bolinhas que o observador pôs à mão ficam onde as pôs; as outras seguem o sistema sem se sobreporem */
  ord.forEach(([c])=>{ const q=xy[c]; if(!q) return; P[c]={x:fx+q.x*fw,y:fy+q.y*fh,livre:true}; fundo=Math.max(fundo,P[c].y+34+Math.max(1,cont[c]||0)*44+16); });
  ord.forEach(([c,,px,py])=>{ if(P[c]) return; const x=fx+px*fw; let y=fy+py*fh;
    ord.forEach(([c2])=>{ const q=P[c2]; if(q&&!q.livre&&Math.abs(q.x-x)<bw+8){ const fim=q.y+34+Math.max(1,cont[c2]||0)*44; if(fim+40>y) y=fim+40; } });
    P[c]={x,y}; fundo=Math.max(fundo,y+34+Math.max(1,cont[c]||0)*44+16); });
  return {P,fh:Math.max(fh,fundo-fy)}; }
/* desenho: modo "plantel" (todos os jogadores por posição) ou um onze (um nome por posição) */
function plantelSvgStr(R,modo){ const {VW,fx,fy,fw,fh,bw}=PLF, kx=fw/68, ky=fh/52.5, cx=fx+fw/2, L='fill="none" stroke="#111" stroke-width="5"', F="Roboto Condensed,Arial Narrow,Arial,sans-serif";
  const O=modo==="plantel"?null:R.onzes[modo], sis=O?(O.sis||R.sistema||"4-3-3"):(R.sistema||"4-3-3"), lay=layoutDe(sis), porId=new Map(R.plantel.map(j=>[j.id,j]));
  const grupos={}; lay.forEach(s=>grupos[s[0]]=[]); const semPos=[];
  /* nomes largados à mão (modo "Mover livremente") saem da pilha da posição e ficam onde foram postos */
  const nl=O?O.nxy:(R.plNom[sis]||{}), soltos=[];
  if(O) lay.forEach(([c])=>{ const j=porId.get(O.pos[c]); if(j) grupos[c].push(j); });
  else R.plantel.forEach(j=>{ if(nl[j.id]){ soltos.push(j); return; } const c=posNoSis(j.slot,sis); if(c) grupos[c].push(j); else semPos.push(j); });
  const ord=(a,b)=>(a.conf===b.conf?0:a.conf?-1:1)||(parseInt(a.n)||999)-(parseInt(b.n)||999);
  const cont={}; lay.forEach(([c])=>cont[c]=O?1:grupos[c].length); const {P:PX,fh:fh2}=posicoesPx(lay,cont,O?O.xy:R.plXY[sis]);
  const linhas=semPos.length?Math.ceil(semPos.length/6):0, base=fy+fh2+30, VH=Math.max(base+(linhas?44+linhas*46:0),...Object.values(nl).map(q=>fy+q.y*fh+60));
  let h=`<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${O?(modo==="prov"?"Onze provável":"Onze alternativo"):"Plantel"} de ${esc(R.adversario)} em ${sis}"><rect x="0" y="0" width="${VW}" height="${VH}" fill="#fff"/>`;
  const nf=Math.round(fh2/(fh/10)); for(let i=0;i<nf;i++) h+=`<rect x="${fx}" y="${fy+i*fh2/nf}" width="${fw}" height="${fh2/nf}" fill="${i%2?"#F1F1F1":"#FAFAFA"}"/>`;
  h+=`<rect x="${cx-3.66*kx}" y="${fy-2.2*ky}" width="${7.32*kx}" height="${2.2*ky}" fill="#D9D9D9" stroke="#111" stroke-width="4"/><rect x="${fx}" y="${fy}" width="${fw}" height="${fh2}" fill="none" stroke="#111" stroke-width="7"/>`;
  h+=`<rect x="${cx-20.16*kx}" y="${fy}" width="${40.32*kx}" height="${16.5*ky}" ${L}/><rect x="${cx-9.16*kx}" y="${fy}" width="${18.32*kx}" height="${5.5*ky}" ${L}/>`;
  h+=`<path d="M ${cx-7.31*kx} ${fy+16.5*ky} A ${9.15*kx} ${9.15*ky} 0 0 0 ${cx+7.31*kx} ${fy+16.5*ky}" ${L}/><path d="M ${cx-9.15*kx} ${fy+fh2} A ${9.15*kx} ${9.15*ky} 0 0 1 ${cx+9.15*kx} ${fy+fh2}" ${L}/>`;
  const caixa=(x,y,j,w,attr)=>{ const t=(j.nome||"?")+(R.capitao===j.id?" (C)":""), lab=(j.n?j.n+"  ":"")+t, fs=23, lim=w-16, cw=lab.length*fs*.5, conf=O?true:j.conf;
    return `<g ${attr} data-bx="${Math.round(x)}" data-by="${Math.round(y)}" style="cursor:grab;touch-action:none"><rect x="${x-w/2}" y="${y}" width="${w}" height="38" rx="5" fill="#fff" stroke="${conf?"#4A4A4A":"#C98A1B"}" stroke-width="3"${conf?"":' stroke-dasharray="9 6"'}/>`+
      `<text x="${x}" y="${y+27}" text-anchor="middle" font-size="${fs}" font-weight="700" font-family="${F}" fill="#1B1A17"${cw>lim?` textLength="${lim}" lengthAdjust="spacingAndGlyphs"`:""}>${j.n?`<tspan fill="#8A857B" font-weight="400">${esc(j.n)}  </tspan>`:""}${esc(t)}</text></g>`; };
  /* cada posição num grupo (data-grp): a bolinha (data-pc) arrasta-se para onde se quiser e leva os nomes */
  lay.forEach(([c,num])=>{ const {x,y}=PX[c], gr=c==="GR";
    const CE=corEq(R), b2=!gr&&!/^#0{6}$/i.test(CE.cam2);
    h+=`<g data-grp="${c}"><g data-pc="${c}" data-cx="${Math.round(x)}" data-cy="${Math.round(y)}" style="cursor:grab;touch-action:none">${b2?`<circle cx="${x}" cy="${y}" r="31" fill="#1B1A17"/>`:""}<circle cx="${x}" cy="${y}" r="27" fill="${gr?CE.gr:CE.cam}" stroke="${b2?CE.cam2:"#1B1A17"}" stroke-width="${b2?6:3}"/><text x="${x}" y="${y+9}" text-anchor="middle" font-size="26" font-weight="700" font-family="${F}" fill="${gr?CE.grNum:CE.num}" pointer-events="none">${num}</text><circle cx="${x}" cy="${y}" r="40" fill="transparent"/></g>`;
    const nomeOnze=(bx,by)=>{ const j=grupos[c][0]; return j?caixa(bx,by,j,bw,`data-os="${c}"`):`<g data-os="${c}" data-bx="${Math.round(bx)}" data-by="${Math.round(by)}" style="cursor:pointer;touch-action:none"><rect x="${bx-bw/2}" y="${by}" width="${bw}" height="38" rx="5" fill="#fff" stroke="#B9B4AA" stroke-width="3" stroke-dasharray="9 6"/><text x="${bx}" y="${by+27}" text-anchor="middle" font-size="21" font-family="${F}" fill="#8A857B">Escolher</text></g>`; };
    if(O){ const q=nl[c]; if(q) soltos.push(()=>nomeOnze(fx+q.x*fw,fy+q.y*fh)); else h+=nomeOnze(x,y+34); }
    else grupos[c].sort(ord).forEach((j,i)=>h+=caixa(x,y+34+i*44,j,bw,`data-pl="${esc(j.id)}"`)); h+=`</g>`; });
  /* nomes soltos por cima, fora dos grupos (não andam com a bolinha) */
  soltos.forEach(s=>{ if(typeof s==="function"){ h+=s(); return; } const q=nl[s.id]; h+=caixa(fx+q.x*fw,fy+q.y*fh,s,bw,`data-pl="${esc(s.id)}"`); });
  const gr=O?"":R.plantel.filter(j=>posNoSis(j.slot,sis)==="GR").length;
  const resumo=O?`${modo==="prov"?"ONZE PROVÁVEL":"ONZE ALTERNATIVO"}  //  ${sis}${R.treinador?"  //  Treinador: "+R.treinador:""}`
    :`GR: ${gr}  //  Campo: ${R.plantel.length-gr-semPos.length}${semPos.length?"  //  Sem posição: "+semPos.length:""}  //  ${sis}${R.treinador?"  //  Treinador: "+R.treinador:""}`;
  const rw=Math.min(fw,resumo.length*12.4+60);
  h+=`<path d="M ${fx} ${fy-58} H ${fx+rw} L ${fx+rw-24} ${fy-12} H ${fx} Z" fill="#1B1A17"/><text x="${fx+18}" y="${fy-26}" font-size="24" font-weight="700" font-family="${F}" fill="#fff">${esc(resumo)}</text>`;
  if(semPos.length){ h+=`<text x="${fx}" y="${base+26}" font-size="24" font-weight="800" font-family="${F}" fill="#C00000">SEM POSIÇÃO NO CAMPO:</text>`;
    semPos.forEach((j,i)=>h+=caixa(fx+128+(i%6)*268,base+44+Math.floor(i/6)*46,j,250,`data-pl="${esc(j.id)}"`)); }
  return h+"</svg>"; }

  <div class="card rev"><h4>Revisão do Rodrigo</h4>${souDono?`<textarea id="rv-t" rows="4" placeholder="Comentários para o observador: nível de detalhe, o que acrescentar, como apresentar.">${esc(rv.texto||"")}</textarea><label class="row" style="gap:10px;min-height:40px"><input type="checkbox" id="rv-ok" style="width:20px;height:20px" ${rv.revisto?"checked":""}> Relatório revisto</label>`
      :rv.texto?`<p style="margin:0;white-space:pre-wrap">${esc(rv.texto)}</p>${rv.revisto?`<span class="chip rev" style="align-self:flex-start">Revisto</span>`:""}`:`<p class="hint" style="margin:0">Ainda sem comentários. Quando enviares para revisão, o Rodrigo deixa aqui as notas.</p>`}</div>`;
  if(souDono&&!soLeitura){ let t=null; const grava=()=>{ const v={texto:$("rv-t").value,revisto:$("rv-ok").checked,em:new Date().toISOString()}; revs[R.id]=v; guardaCache(); gravaDoc(revPath(R),v); };
    $("rv-t").oninput=()=>{ clearTimeout(t); t=setTimeout(grava,700); }; $("rv-ok").onchange=()=>{ grava(); toast($("rv-ok").checked?"Marcado como revisto":"Revisão reaberta"); }; }
  if(!ed) return;
  $("c-add").onclick=()=>editaRel(R=>R.clips.push({id:nid("c"),jogo:(R.jogos[R.jogos.length-1]||{}).id||"",ini:"",fim:"",frase:""}));
  box.querySelectorAll("[data-cdel]").forEach(b=>confirma2(b,"Apagar?",()=>editaRel(R=>R.clips=R.clips.filter(c=>c.id!==b.dataset.cdel))));
  box.querySelectorAll("[data-cev]").forEach(b=>b.onclick=()=>editaRel(R=>{ const e=R.evid.find(x=>x.id===b.dataset.cev); const s=minSeg(e.min); R.clips.push({id:nid("c"),ev:e.id,jogo:e.jogo,ini:e.min,fim:s!=null?minNorm(Math.floor((s+20)/60)+":"+String((s+20)%60).padStart(2,"0")):"",frase:e.txt}); })); }

function secNotas(R,box,ed){ const ns=R.evid.filter(e=>!e.q);
  box.innerHTML=`<header><h3>Notas por arrumar</h3><p>As notas rápidas ficam aqui até as ligares a uma pergunta, a uma bola parada ou a um jogador. Toca numa nota para a arrumar.</p></header>
    ${ns.length?`<div class="card">${listaEv(R,"",ed).replace(/<button class="btn sm addev"[^>]*>[^<]*<\/button>/,"")}</div>`:`<div class="empty"><b>Tudo arrumado.</b><span>No estádio, usa o botão <b>+ Nota</b> para registar depressa. As notas aparecem aqui.</span></div>`}`;
  ligaEv(box,R); }

$("fab").onclick=()=>{ const S=SECS.find(s=>s.k===vista.sec); folhaEv(null,S&&S.q?"":"",true); };

/* ======================= nomes dos observadores ======================= */
async function carregaNomes(ids){ if(!usr||!souDono) return; const falta=[...new Set(ids)].filter(i=>i&&i!=="local"&&!(i in nomes)); if(!falta.length) return;
  try{ const ps=await usr.profiles(falta); let mud=false; falta.forEach(i=>{ const n=(ps[i]&&ps[i].name)||""; if(nomes[i]!==n){ nomes[i]=n; mud=true; } }); if(mud&&!aEscrever()) render(); }catch(e){} }

/* ======================= arranque ======================= */
function carregaCache(){ const c=LS(CACHE); if(c){ revs=c.revs||{}; Object.entries(c.rels||{}).forEach(([id,R])=>{ try{ rels[id]=normRel({...R,id}); }catch(e){} }); }
  Object.entries(LS(BASES)||{}).forEach(([s,B])=>{ try{ bases[s]=normBase({...B,equipa:B.equipa||B.adversario},s); }catch(e){} });
  const v=LS("sca-obs-vista"); if(v&&v.tipo) vista=v; }
carregaCache();
$("dl-eq").innerHTML=TODAS.map(n=>`<option value="${esc(n)}"></option>`).join("");
render(); estado();
(async()=>{
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ db=null; }
  try{ usr=await window.claude.use("user"); }catch(e){ usr=null; }
  if(usr){ try{ meId=await usr.id(); }catch(e){} try{ souDono=!!(await usr.isOwner()); }catch(e){} try{ if(await usr.can("data.write")===false&&!souDono){ /* as regras próprias decidem: tenta e, se recusar, fica só leitura */ } }catch(e){} }
  if(!db||!meId){ semDb=true; meId=meId||"local"; Object.values(rels).forEach(R=>{ if(!R.autor) R.autor=meId; }); estado(); render(); return; }
  /* relatórios criados sem ligação passam para o autor certo */
  Object.values(rels).forEach(R=>{ if(R.autor==="local"){ R.autor=meId; guardaRel(R,true); } });
  estado(); reenvia();
  const subs={};
  const ouveAutor=uid=>{ if(subs[uid]) return; subs[uid]=true;
    db.collection(`obs/${uid}/relatorios`).onSnapshot(q=>{ if(q.metadata?.hasPendingWrites) return; let mud=false; const vistos=new Set();
      q.docs.forEach(d=>{ const x=d.data(); if(!x) return; vistos.add(d.id); const p=`obs/${uid}/relatorios/${d.id}`; if(pend[p]||tSave[d.id]&&rels[d.id]&&aEscrever()) return;
        const R=normRel({...x,id:d.id,autor:uid}); if(JSON.stringify(R)!==JSON.stringify(rels[d.id])){ rels[d.id]=R; mud=true; } });
      Object.values(rels).forEach(R=>{ if(R.autor===uid&&!vistos.has(R.id)&&!pend[relPath(R)]&&!q.metadata?.fromCache){ delete rels[R.id]; mud=true; } });
      if(mud){ guardaCache(); if(aEscrever()||aArrastar) precisaRender=true; else render(); } estado(); },e=>{ if(e?.code==="revoked") setStatus("local","Acesso retirado"); });
    db.collection(`obs/${uid}/revisoes`).onSnapshot(q=>{ if(q.metadata?.hasPendingWrites) return; let mud=false;
      q.docs.forEach(d=>{ const x=d.data(); if(!x||pend[`obs/${uid}/revisoes/${d.id}`]) return; const v={texto:String(x.texto||""),revisto:!!x.revisto,em:x.em||""}; if(JSON.stringify(v)!==JSON.stringify(revs[d.id])){ revs[d.id]=v; mud=true; } });
      if(mud){ guardaCache(); if(aEscrever()||aArrastar) precisaRender=true; else render(); } },()=>{}); };
  ouveAutor(meId);
  /* planteis base: toda a gente lê, só o dono escreve */
  db.collection("base").onSnapshot(q=>{ if(q.metadata?.hasPendingWrites) return; let mud=false;
    q.docs.forEach(d=>{ const x=d.data(); if(!x||pend[`base/${d.id}`]||tSave["base:"+d.id]&&vista.tipo==="base"&&aEscrever()) return; const B=normBase(x,d.id);
      if(JSON.stringify(B)!==JSON.stringify(bases[d.id])){ bases[d.id]=B; mud=true; } });
    if(mud){ guardaCacheBase(); if(aEscrever()||aArrastar) precisaRender=true; else render(); } },()=>{});
  if(souDono) db.collection("obs").onSnapshot(q=>{ q.docs.forEach(d=>ouveAutor(d.id)); carregaNomes(q.docs.map(d=>d.id)); },()=>{});
  render();
})();
</script>
