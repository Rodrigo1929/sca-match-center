<style>
/* Layout: cabeçalho fixo · lista de relatórios OU relatório com secções (lateral no PC, faixa no telemóvel) · botão "+ Nota" sempre à mão */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F6F1; --ink:#1B1A17; --muted:#6B675E; --line:#DEDAD0;
  --red:#C00000; --red-ink:#FFFFFF; --gold:#B8963F; --gold-soft:#F4EBD3; --blue:#1F5FBF; --blue-soft:#E3ECF9;
  --ok:#1E7A46; --ok-soft:#E3F2E8; --warn:#A35A00; --warn-soft:#FBEEDB; --shadow:0 1px 2px rgba(27,26,23,.06),0 4px 14px rgba(27,26,23,.06);
  --f-display:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1D1C1A; --surface-2:#252320; --ink:#F1EEE7; --muted:#A39E93; --line:#36332E;
  --red:#E0393A; --red-ink:#FFFFFF; --gold:#D6B262; --gold-soft:#352C18; --blue:#5B8FE0; --blue-soft:#1C2A40;
  --ok:#5BC48A; --ok-soft:#173225; --warn:#E3A44B; --warn-soft:#3A2A12; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1D1C1A; --surface-2:#252320; --ink:#F1EEE7; --muted:#A39E93; --line:#36332E;
  --red:#E0393A; --red-ink:#FFFFFF; --gold:#D6B262; --gold-soft:#352C18; --blue:#5B8FE0; --blue-soft:#1C2A40;
  --ok:#5BC48A; --ok-soft:#173225; --warn:#E3A44B; --warn-soft:#3A2A12; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{width:34px;height:34px;object-fit:contain}
.brand h1{font-size:22px;font-weight:800;line-height:1}
.brand h1 span{color:var(--red)}
.brand small{display:block;font-family:var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;font-size:11.5px;margin-top:2px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--ok)} .status.busy i{background:var(--gold)} .status.local i{background:var(--warn)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:1320px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:42px;display:inline-flex;align-items:center;gap:6px;justify-content:center;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:default}
.banner{border-radius:10px;padding:10px 14px;font-size:14.5px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.banner b{font-weight:700}
/* lista */
.lhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lhead h2{font-size:26px;margin-right:auto}
.lhead p{margin:4px 0 0;color:var(--muted);font-size:14.5px;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.rcard h3{font-size:21px}
.rcard .meta{font-size:13.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:12px;letter-spacing:.6px;text-transform:uppercase;border-radius:999px;padding:3px 9px;font-weight:700;white-space:nowrap}
.chip.rasc{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

@media (max-width:999px){
  .rgrid{grid-template-columns:minmax(0,1fr)}

  nav.secs .grp{display:none}
  nav.secs button{white-space:nowrap;flex:none;background:var(--surface);border:1px solid var(--line)}
  nav.secs button[aria-current="true"]{border-color:var(--red)}
}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec > header h3{font-size:24px}
.sec > header p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h4{font-size:17px;line-height:1.25}
.q{gap:8px}
.q .qt{display:flex;gap:10px;align-items:baseline}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:44px;width:100%;min-width:0;color:var(--ink)}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.evs{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);text-align:left;width:100%}
.ev .tm{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;min-width:46px}
.ev .tx{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev .tags{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.ev .tags a{color:var(--blue);font-weight:600}
.fq{font-family:var(--f-display);font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;border-radius:4px;padding:1px 6px}
.fq.rec{background:var(--ok-soft);color:var(--ok)}
.fq.pont{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.fq.conf{background:var(--warn-soft);color:var(--warn)}
.addev{align-self:flex-start}
.hint{font-size:13.5px;color:var(--muted)}
.prin{display:flex;gap:6px;flex-wrap:wrap}
.prin span{font-family:var(--f-display);font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:12.5px;background:var(--red);color:var(--red-ink);border-radius:4px;padding:3px 8px}
/* campo */
.pitch{background:#fff;border:1px solid #CFCFCF;border-radius:6px;overflow:hidden;touch-action:none;max-width:520px;width:100%;margin:0 auto}
.pitch svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.pitch.half{max-width:680px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.estr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.estr{grid-template-columns:minmax(0,1fr)}}
.bpl{display:flex;flex-direction:column;gap:8px}
.bpi{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:50px;width:100%}
.bpi b{font-family:var(--f-display);font-size:16px}
.bpi span{color:var(--muted);font-size:13.5px;margin-left:auto}
.bpi[aria-expanded="true"]{border-color:var(--red)}
.pl{display:flex;flex-direction:column;gap:10px}
.plh{display:flex;gap:10px;align-items:center}
.plh .num{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--blue);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.three{display:grid;gap:8px}
.three > div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.three > div > b{font-family:var(--f-display);font-size:20px;color:var(--red);text-align:center;padding-top:8px}
.three.op > div > b{color:var(--ok)}
.clip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.cores input[type=color]{width:52px;height:44px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:none}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;min-height:0}
.q.qok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.htab{border-collapse:collapse;font-size:13.5px;min-width:100%}.htab th,.htab td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;min-width:170px}
.htab tbody th{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:220px;max-width:300px}.htab tr.g th{background:var(--surface-2);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.8px;font-size:12px;color:var(--muted)}
.htab td.mud{background:var(--warn-soft);color:var(--ink)}
.q.qpend{border:2px dashed var(--warn);background:color-mix(in srgb,var(--warn-soft) 55%,var(--surface))}
.pendl{gap:8px;justify-content:space-between;font-size:14px;color:var(--warn);font-weight:600}
.q.qok .qn{color:var(--ok)}
.qop button{text-align:left}
.qrod{justify-content:space-between;gap:8px}
.qfq button{min-height:40px;padding:4px 12px;font-size:13.5px}
.qac{display:flex;gap:6px;flex-wrap:wrap}
.qjog{gap:6px}
.jchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px;font-weight:600}
.jchip button{border:0;background:transparent;min-height:30px;min-width:30px;color:var(--muted)}
.qq{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:56vh;overflow:auto}
.pgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left;min-height:58px;display:flex;flex-direction:column;gap:1px}
.pgrid button b{font-family:var(--f-display);font-size:20px;color:var(--blue);line-height:1}
.pgrid button span{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid button small{font-size:11px;color:var(--muted)}
.pgrid button[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.ptab{width:100%;border-collapse:collapse;font-size:14.5px}
.ptab th{text-align:left;font-family:var(--f-display);font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptab td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ptab input[type=text],.ptab select{min-height:40px;padding:6px 8px}
.ptab tr.porconf td:nth-child(3) select{border-color:var(--warn);border-style:dashed}
.rev{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
/* folha (diálogo) */
.sheet-bg{position:fixed;inset:0;background:rgba(15,14,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(620px,100%);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:761px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h3{font-size:22px}
.sheet h4{font-family:var(--f-display);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.actions .l{margin-right:auto}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;min-height:54px;padding:0 20px;border-radius:999px;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14.5px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header class="top"><div class="in">
  <div class="brand"><img src="{{LOGO}}" alt=""><div><h1><span>SCA</span> Observação</h1><small>Observação de adversários</small></div></div>

<script>

const COMP="Campeonato de Futebol dos Açores", EPOCA="2026/27";

   [código, número, nome, x, y] em frações do meio-campo (baliza em cima; a direita do adversário fica à esquerda do ecrã).

const POS_NOME={GR:"Guarda-redes",LD:"Lateral direito",LE:"Lateral esquerdo",ALD:"Ala direito",ALE:"Ala esquerdo",DCD:"Central direito",DC:"Central",DCE:"Central esquerdo",
  MDC:"Médio defensivo",MDCD:"Médio defensivo direito",MDCE:"Médio defensivo esquerdo",MCD:"Médio centro direito",MCE:"Médio centro esquerdo",MO:"Médio ofensivo",
  MD:"Médio direito",ME:"Médio esquerdo",ED:"Extremo direito",EE:"Extremo esquerdo",AVD:"Avançado direito",AVE:"Avançado esquerdo",PL:"Ponta de lança",PLD:"Ponta de lança direito",PLE:"Ponta de lança esquerdo"};

  MDC:["MDCD","MDCE","MCD","MCE","DC"],MDCD:["MDC","MCD","MDCE","MCE"],MDCE:["MDC","MCE","MDCD","MCD"],MCD:["MDCD","MDC","MCE","MO"],MCE:["MDCE","MO","MDC","MCD"],MO:["MCE","MCD","MDC","PLE","PL"],
  MD:["ED","ALD","MCD","LD","AVD"],ME:["EE","ALE","MCE","LE","AVE"],ED:["AVD","MD","ALD","PLD","PL"],EE:["AVE","ME","ALE","PLE","PL"],AVD:["ED","PLD","MD","PL"],AVE:["EE","PLE","ME","PL"],
  PL:["PLD","PLE","AVD","AVE"],PLD:["PL","PLE","AVD"],PLE:["PL","PLD","AVE"]};
const L4=[["GR","1",.5,.035],["LD","2",.10,.25],["DCD","3",.31,.20],["DCE","4",.69,.20],["LE","5",.90,.25]];
const LAYOUTS={
  "4-3-3":[...L4,["MDC","6",.5,.46],["MCD","8",.31,.53],["MO","10",.69,.53],["ED","7",.10,.75],["PL","9",.5,.78],["EE","11",.90,.75]],

let pend=LS(PEND)||{}, pendSeq=0; const filas={};

const errosGrav={}; let revogado=false;

  if(revogado){ setStatus("local","Recarrega a página para gravar"); return; }
  if(!n){ setStatus("ok","Guardado"); return; } const off=falhou||navigator.onLine===false||Object.keys(errosGrav).some(p=>pend[p]);
  setStatus(off?"local":"busy",(off?"Não gravou · ":"A enviar · ")+n+(n===1?" alteração por enviar":" alterações por enviar")+(off?" · tocar para ver":"")); }
/* uma gravação que não responde não pode prender as seguintes desse documento */
const comPrazo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout",message:`sem resposta em ${ms/1000} s`}),ms))]);

function envia(path){ const P=pend[path]; if(!P||!db||soLeitura) return; const st=P.s;

      return comPrazo(c.del?db.doc(path).delete():c.p?db.doc(path).update({...c.p,atualizadoEm:ag}):db.doc(path).set({...c.b,atualizadoEm:ag}),20000).then(()=>true); })
    .then(enviado=>{ delete errosGrav[path]; tentativas[path]=0; const id=idDePath(path); if(enviado&&id&&!P.del) srvs[id]=P.p?aplicaPatch(srvs[id]||{},P.p):clone(P.b); if(pend[path]&&pend[path].s===st){ delete pend[path]; salvaPend(); } guardaCache(); estado(false); })

    s_.querySelector("#eg-re").onclick=()=>{ fecha(); Object.keys(tentativas).forEach(k=>tentativas[k]=0); reenvia(); estado(false); toast("A tentar gravar outra vez"); };

/* ======================= edição partilhada: gravar só o que mudou e juntar o que chega =======================
   Os objetos juntam-se campo a campo (update); as listas (jogos, plantel, evidências…) vão inteiras. */
const Jt=v=>JSON.stringify(v===undefined?null:v), ehObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
const semMeta=o=>{ const c=clone(o||{}); delete c.atualizadoEm; return c; };
/* diferenças de a para b, só com o que mudou (campos que desapareceram vão a null) */
function difObj(a,b){ if(Jt(a)===Jt(b)) return undefined; if(ehObj(a)&&ehObj(b)){ const o={}; new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{ if(k==="atualizadoEm") return; if(!(k in b)){ o[k]=null; return; } const d=difObj(a[k],b[k]); if(d!==undefined) o[k]=d; }); return Object.keys(o).length?o:undefined; } return b===undefined?null:clone(b); }
/* aplica um update como o servidor: objetos juntam-se, o resto substitui */
function aplicaPatch(a,pt){ if(!ehObj(pt)) return clone(pt); const o=ehObj(a)?clone(a):{}; Object.entries(pt).forEach(([k,v])=>o[k]=ehObj(v)?aplicaPatch(o[k],v):clone(v)); return o; }
/* junção a três: base (último do servidor), local (aqui) e remoto (o que chegou). Campo mudado só de um lado fica esse; mudado dos dois lados fica o daqui (vai ser gravado) */

  if(ehObj(l)&&ehObj(r)){ const o={}; new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{ const v=junta3(ehObj(b)?b[k]:undefined,l[k],r[k]); if(v!==undefined) o[k]=v; }); return o; } return clone(l); }
/* fila: atualizações parciais do mesmo documento juntam-se numa só */

  pend[path]=c&&c.b?{s,b:aplicaPatch(c.b,pt)}:{s,p:c&&c.p?aplicaPatch(c.p,pt):pt}; salvaPend(); estado(false); envia(path); }
const idDePath=path=>/^obs\/[^/]+\/relatorios\//.test(path)?path.split("/").pop():null;

/* ======================= histórico de alterações (log/<quem>/e/<id>) =======================

const K=10;
/* campo branco, linhas pretas e balizas cinzentas, como os quadros da SCA Match Center */
function campoSvg(meio){ const L=68*K, C=(meio?36:105)*K, s='stroke="#111" stroke-width="3" fill="none"'; let h="";
  const n=meio?6:18; for(let i=0;i<n;i++) h+=`<rect x="0" y="${i*C/n}" width="${L}" height="${C/n+.5}" fill="${i%2?"#EEEEEE":"#FFFFFF"}"/>`;
  const baliza=top=>{ const y=top?-20:1050; let g=`<rect x="303.4" y="${y}" width="73.2" height="20" fill="#D9D9D9" stroke="#111" stroke-width="2.4"/>`; for(let k=1;k<4;k++) g+=`<line x1="${303.4+k*73.2/4}" y1="${y}" x2="${303.4+k*73.2/4}" y2="${y+20}" stroke="#888" stroke-width="1"/>`; return g; };
  const area=(top)=>{ const y0=top?0:1050, d=top?1:-1, yb=y0+d*165, yg=y0+d*55, sp=y0+d*110;
    h+=`<rect x="138.4" y="${Math.min(y0,yb)}" width="403.2" height="165" ${s}/><rect x="248.4" y="${Math.min(y0,yg)}" width="183.2" height="55" ${s}/>`;
    h+=`<circle cx="340" cy="${sp}" r="3.5" fill="#111"/><path d="M 266.9 ${yb} A 91.5 91.5 0 0 ${top?0:1} 413.1 ${yb}" ${s}/>`+baliza(top); };
  area(true);
  if(!meio){ h+=`<line x1="0" y1="525" x2="${L}" y2="525" ${s}/><circle cx="340" cy="525" r="91.5" ${s}/><circle cx="340" cy="525" r="3.5" fill="#111"/>`; area(false); }
  h+=meio?`<path d="M 0 ${C} L 0 0 L ${L} 0 L ${L} ${C}" stroke="#111" stroke-width="4" fill="none"/>`:`<rect x="0" y="0" width="${L}" height="${C}" stroke="#111" stroke-width="4" fill="none"/>`;
  [[0,0,0,1],[L,0,-1,1]].concat(meio?[]:[[0,C,1,-1],[L,C,-1,-1]]).forEach(([x,y,dx,dy])=>h+=`<path d="M ${x+dx*10} ${y} A 10 10 0 0 ${dx*dy>0?1:0} ${x} ${y+dy*10}" ${s}/>`);
  return h; }

    plantel:pl,sistema:B.sistema||"",cores:clone(B.cores||{}),onzeProv:U?onze(U.onzes.prov):null,onzeAlt:U?onze(U.onzes.alt):null,

const textoAc=(R,a)=>{ const n=id=>{ const j=R.plantel.find(x=>x.id===id); return j?(j.n?j.n+" ":"")+j.nome:"?"; }; return a.t==="golo"?(a.eq==="contra"?"Golo do adversário":"Golo · "+n(a.jog)):a.t==="sub"?`Substituição · sai ${n(a.jog)} · entra ${n(a.jog2)}`:(a.t==="am"?"Amarelo · ":"Vermelho · ")+n(a.jog); };
const minEv=e=>e.min?e.min+(/:/.test(e.min)?"":"'"):"";

/* ======================= PDF do relatório de um jogo ======================= */
async function geraPdf(R){ await carregaLib("pdf"); const {jsPDF}=window.jspdf, d=new jsPDF({unit:"mm",format:"a4"}), W=210, M=14, LW=W-2*M; let y=0;
  const novaPag=()=>{ d.addPage(); y=M; }, cabe=h=>{ if(y+h>285) novaPag(); };
  const txt=(t,{t:tam=10,b=false,cor=[27,26,23],x=M,w=LW,esp=1.2}={})=>{ if(!t) return; d.setFont("helvetica",b?"bold":"normal"); d.setFontSize(tam); d.setTextColor(...cor); const ls=d.splitTextToSize(String(t),w), lh=tam*.36*esp; ls.forEach(l=>{ cabe(lh); d.text(l,x,y+lh*.8); y+=lh; }); };
  const tit=t=>{ cabe(14); y+=3; d.setFillColor(192,0,0); d.rect(M,y,LW,7,"F"); d.setFont("helvetica","bold"); d.setFontSize(11); d.setTextColor(255,255,255); d.text(t.toUpperCase(),M+2,y+5); y+=10; };
  const img=async(svg,w)=>{ try{ const P=await svgPng(svg,true), h=w*P.h/P.w; cabe(h+2); d.addImage(P.url,"JPEG",M,y,w,h); y+=h+3; }catch(e){} };
  const J=R.jogos[0]||{acont:[],onze:[]}, nm=id=>{ const j=R.plantel.find(x=>x.id===id); return j?(j.n?j.n+" ":"")+j.nome:""; };
  d.setFillColor(27,26,23); d.rect(0,0,W,26,"F"); d.setFont("helvetica","bold"); d.setFontSize(18); d.setTextColor(255,255,255); d.text(`${R.adversario||"Adversário"} ${J.vs?"vs "+J.vs:""}`,M,12);
  d.setFontSize(10); d.setFont("helvetica","normal"); d.text([`SC Angrense · Observação de adversários`,[J.data?dataPt(J.data):"",J.local==="casa"?"Em casa":J.local==="fora"?"Fora":"",J.res?"Resultado "+J.res:"",R.autor!==meId&&nomes[R.autor]?"Observador: "+nomes[R.autor]:""].filter(Boolean).join(" · ")].join("   "),M,20); y=32;
  tit("Ficha do jogo"); txt([R.competicao,J.como?"Observado: "+({vivo:"ao vivo",video:"vídeo",ambos:"ao vivo e vídeo"}[J.como]||J.como):"",J.video?"Vídeo: "+J.video:""].filter(Boolean).join(" · "));
  if(J.onze.length) txt("Onze inicial: "+J.onze.map(nm).filter(Boolean).join(", "));
  J.acont.slice().sort((a,b)=>(parseInt(a.min)||0)-(parseInt(b.min)||0)).forEach(a=>txt(`${a.min?a.min+"'":"–"}  ${textoAc(R,a)}`));
  if(J.ctx) txt("Contexto: "+J.ctx);
  tit("Equipa"); txt([R.sistema?"Sistema habitual: "+R.sistema:"",R.treinador?"Treinador: "+R.treinador:"",R.capitao?"Capitão: "+nm(R.capitao):""].filter(Boolean).join(" · ")); if(R.plantelNotas) txt(R.plantelNotas);
  if(temEstrutura(R)){ tit("Estrutura no campo"); const y0=y; cabe(140); const yy=y; for(const [k,x] of [["com",M],["sem",M+LW/2+2]]){ try{ const P=await svgPng(svgEstrutura(R,k),true), w=LW/2-2, h=w*P.h/P.w; d.addImage(P.url,"JPEG",x,yy+5,w,h); d.setFont("helvetica","bold"); d.setFontSize(9); d.setTextColor(27,26,23); d.text(k==="com"?`Com bola · ${R.onze.com.sis}`:`Sem bola · ${R.onze.sem.sis}`,x,yy+3); y=Math.max(y,yy+5+h+3); }catch(e){} }
    [R.onze.com.nota,R.onze.sem.nota].forEach((n,i)=>n&&txt((i?"Sem bola: ":"Com bola: ")+n)); }
  for(const S of SEC_Q){ const qs=GUIAO[S.k].filter(q=>respondida(R,q.id)); if(!qs.length) continue; tit(S.t);
    for(const q of qs){ const C=R.chk[q.id], i=GUIAO[S.k].indexOf(q)+1; y+=1; txt(`${i}. ${q.t}`,{b:true,t:10.5}); const r=respTexto(R,q); if(r) txt(r,{cor:[60,60,60]}); if(C.nota) txt("Notas: "+C.nota,{cor:[90,90,90],t:9.5});
      if(q.quadro&&temQuadro(C.quadro)) await img(svgQuadro(R,C.quadro,q.quadro==="meio"),q.quadro==="meio"?110:70);
      R.evid.filter(e=>e.q===q.id).forEach(e=>txt(`• ${minEv(e)?minEv(e)+" · ":""}${e.txt||""}${e.freq?" ("+(FREQ[e.freq]||e.freq).toLowerCase()+")":""}`,{t:9.5})); } }
  for(const [lado,nmL] of [["of","Bolas paradas ofensivas"],["def","Bolas paradas defensivas"]]){ const bs=R.bp.filter(b=>b.lado===lado); if(!bs.length) continue; tit(nmL);
    for(const B of bs){ y+=1; txt(nomeBp(B),{b:true,t:10.5}); BP_ASP.forEach(([k,t])=>B.asp[k]&&txt(`${t}: ${B.asp[k]}`,{t:9.5})); if(temQuadro(B)) await img(svgQuadro(R,B,true,.65),110);
      R.evid.filter(e=>e.q==="bp:"+B.id).forEach(e=>txt(`• ${minEv(e)?minEv(e)+" · ":""}${e.txt||""}`,{t:9.5})); } }
  if(R.refs.length){ tit("Jogadores de referência"); R.refs.forEach(x=>{ y+=1; txt(`${x.n?x.n+" ":""}${x.nome||"Sem nome"}${x.pos?" · "+x.pos:""}`,{b:true,t:10.5}); const pp=x.papeis.map(k=>PAPEIS[k]).filter(Boolean).join(", "); if(pp) txt(pp,{cor:[90,90,90],t:9.5}); if(x.fortes) txt(x.fortes,{t:9.5});
    R.evid.filter(e=>e.q==="jogd:"+x.id).forEach(e=>txt(`• Dificuldade: ${minEv(e)?minEv(e)+" · ":""}${e.txt||""}`,{t:9.5})); }); }
  const S=R.sint; if(S.estrutura||S.ameacas.some(Boolean)||S.oport.some(Boolean)||S.bpref){ tit("Síntese"); if(S.estrutura) txt(S.estrutura);
    S.ameacas.forEach((a,i)=>a&&txt(`Ameaça ${i+1}: ${a}`)); S.oport.forEach((a,i)=>a&&txt(`Oportunidade ${i+1}: ${a}`)); if(S.bpref) txt("Bolas paradas e jogadores: "+S.bpref); }
  const n=d.getNumberOfPages(); for(let i=1;i<=n;i++){ d.setPage(i); d.setFont("helvetica","normal"); d.setFontSize(8); d.setTextColor(140,140,140); d.text(`${R.adversario} · ${tituloJogo(R)} · ${i}/${n}`,W-M,292,{align:"right"}); }
  return d.output("blob"); }
async function exportaPdf(R,btn){ const o=btn&&btn.textContent; if(btn){ btn.disabled=true; btn.textContent="A preparar…"; }
  try{ await entregaFicheiro(nomeFicheiro(R,"pdf"),await geraPdf(R)); }catch(e){ toast(e.message||"Não foi possível gerar o PDF"); } finally{ if(btn){ btn.disabled=false; btn.textContent=o; } } }

/* ======================= PowerPoint para os jogadores: só os pontos escolhidos; cada evidência dá um diapositivo em branco para o clip ======================= */
function pontosApresentacao(R){ const P=[]; if(temEstrutura(R)) P.push({k:"estr",g:"Estrutura",t:"Estrutura no campo (com e sem bola)"});
  SEC_Q.forEach(S=>GUIAO[S.k].forEach((q,i)=>{ if(respondida(R,q.id)) P.push({k:"q:"+q.id,g:S.t,t:`${i+1}. ${q.t}`}); }));
  [["of","Bolas paradas ofensivas"],["def","Bolas paradas defensivas"]].forEach(([l,g])=>R.bp.filter(b=>b.lado===l).forEach(B=>P.push({k:"bp:"+B.id,g,t:nomeBp(B)})));
  R.refs.forEach(x=>P.push({k:"ref:"+x.id,g:"Jogadores de referência",t:`${x.n?x.n+" ":""}${x.nome||"Sem nome"}`}));
  if(R.sint.ameacas.some(Boolean)||R.sint.oport.some(Boolean)) P.push({k:"sint",g:"Síntese",t:"Ameaças e oportunidades"}); return P; }
function folhaApresentacao(R){ const P=pontosApresentacao(R); if(!P.length){ toast("Ainda não há respostas para mostrar."); return; } const sel=new Set(); let g="";
  folha(`<h3>Apresentação para os jogadores</h3><p class="hint" style="margin:0">Escolhe os pontos a mostrar. Cada evidência ligada a um ponto dá um diapositivo em branco, com o jogo e o minuto, para pores o clip.</p>
    <div class="evs" id="ap-l" style="max-height:52vh;overflow:auto">${P.map(x=>{ const h=x.g!==g?`<h4 style="margin:8px 0 2px">${esc(x.g)}</h4>`:""; g=x.g; const ne=x.k.startsWith("q:")?R.evid.filter(e=>e.q===x.k.slice(2)).length:x.k.startsWith("bp:")?R.evid.filter(e=>e.q===x.k).length:x.k.startsWith("ref:")?R.evid.filter(e=>e.q==="jogd:"+x.k.slice(4)).length:0;
      return h+`<button type="button" class="ev" data-k="${esc(x.k)}" aria-pressed="false" style="grid-template-columns:28px minmax(0,1fr)"><span class="tm">☐</span><span class="tx">${esc(x.t)}${ne?` <span class="hint">· ${ne} ${ne===1?"clip":"clips"}</span>`:""}</span></button>`; }).join("")}</div>
    <div class="actions"><button class="btn l" id="ap-todos">Escolher todos</button><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ap-ok" disabled>Gerar PowerPoint</button></div>`,(s_,fecha)=>{
    const pinta=()=>{ s_.querySelectorAll("#ap-l [data-k]").forEach(b=>{ const on=sel.has(b.dataset.k); b.setAttribute("aria-pressed",String(on)); b.querySelector(".tm").textContent=on?"☑":"☐"; b.style.borderColor=on?"var(--red)":""; }); const ok=s_.querySelector("#ap-ok"); ok.disabled=!sel.size; ok.textContent=sel.size?`Gerar PowerPoint (${sel.size})`:"Gerar PowerPoint"; };
    s_.querySelectorAll("#ap-l [data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; sel.has(k)?sel.delete(k):sel.add(k); pinta(); });
    s_.querySelector("#ap-todos").onclick=()=>{ P.forEach(x=>sel.add(x.k)); pinta(); };
    s_.querySelector("#ap-ok").onclick=async()=>{ const b=s_.querySelector("#ap-ok"); b.disabled=true; b.textContent="A preparar…"; try{ const blob=await geraPptx(R,P.filter(x=>sel.has(x.k)).map(x=>x.k)); fecha(); await entregaFicheiro(nomeFicheiro(R,"pptx"),blob); }catch(e){ b.disabled=false; pinta(); toast(e.message||"Não foi possível gerar o PowerPoint"); } }; }); }
async function geraPptx(R,chaves){ await carregaLib("ppt"); const pp=new window.PptxGenJS(); pp.layout="LAYOUT_WIDE"; pp.title=`${R.adversario} · ${tituloJogo(R)}`;
  const J=R.jogos[0]||{}, F="Arial", logo=(document.querySelector(".brand img")||{}).src||"", sem=u=>u.replace(/^data:/,"");
  const cab=(sl,a,b)=>{ sl.background={color:"FFFFFF"}; sl.addText([{text:a,options:{color:"1B1A17",bold:true}},{text:b?"  "+b:"",options:{color:"C00000",bold:true}}],{x:.5,y:.3,w:11.3,h:.8,fontFace:F,fontSize:24,valign:"middle",isTextBox:true,margin:0,fit:"shrink"});
    sl.addShape(pp.ShapeType.rect,{x:.5,y:1.12,w:11.3,h:.06,fill:{color:"C9B26B"},line:{color:"C9B26B"}}); if(logo) sl.addImage({data:sem(logo),x:12.25,y:.25,w:.75,h:.7}); };
  const lista=(sl,linhas,x,y,w,h)=>{ const runs=[]; linhas.forEach(([t,o],i)=>runs.push({text:t,options:{...o,breakLine:i<linhas.length-1}})); if(runs.length) sl.addText(runs,{x,y,w,h,fontFace:F,fontSize:16,color:"1B1A17",valign:"top",isTextBox:true,margin:0,paraSpaceAfter:6,fit:"shrink"}); };
  const clip=(grupo,titulo,e)=>{ const sl=pp.addSlide(); sl.background={color:"FFFFFF"}; sl.addText(`Clip · ${grupo}`,{x:.5,y:.3,w:12.3,h:.5,fontFace:F,fontSize:16,bold:true,color:"C00000",isTextBox:true,margin:0});
    sl.addText(`${titulo}  ·  ${J.vs?"vs "+J.vs+" · ":""}${minEv(e)?"minuto "+minEv(e):"minuto por indicar"}`,{x:.5,y:.8,w:12.3,h:.45,fontFace:F,fontSize:13,color:"6B675E",isTextBox:true,margin:0,fit:"shrink"});
    sl.addShape(pp.ShapeType.rect,{x:.5,y:1.45,w:12.33,h:5.75,fill:{color:"F3F1EC"},line:{color:"C9C4B8",dashType:"dash",width:1}}); };
  const capa=pp.addSlide(); capa.background={color:"1B1A17"}; if(logo) capa.addImage({data:sem(logo),x:.7,y:.6,w:1.3,h:1.2});
  capa.addText(R.adversario||"Adversário",{x:.7,y:2.4,w:11.9,h:1.2,fontFace:F,fontSize:44,bold:true,color:"FFFFFF",isTextBox:true,margin:0});
  capa.addText([J.vs?"vs "+J.vs:"",J.data?dataPt(J.data):"",J.res||""].filter(Boolean).join("  ·  "),{x:.7,y:3.6,w:11.9,h:.6,fontFace:F,fontSize:20,color:"C9B26B",isTextBox:true,margin:0});
  capa.addText("SC Angrense · Observação de adversários",{x:.7,y:6.6,w:11.9,h:.4,fontFace:F,fontSize:12,color:"A39E93",isTextBox:true,margin:0});
  const m=new Map(R.plantel.map(j=>[j.id,j]));
  for(const k of chaves){
    if(k==="estr"){ const sl=pp.addSlide(); cab(sl,"Estrutura no campo",""); for(const [e,x] of [["com",1.2],["sem",7.2]]){ try{ const P=await svgPng(svgEstrutura(R,e)), h=5.6, w=h*P.w/P.h; sl.addImage({data:sem(P.url),x,y:1.55,w,h}); sl.addText(e==="com"?`Com bola · ${R.onze.com.sis}`:`Sem bola · ${R.onze.sem.sis}`,{x,y:1.3,w:4,h:.3,fontFace:F,fontSize:12,bold:true,color:"1B1A17",isTextBox:true,margin:0}); }catch(er){} } continue; }
    if(k.startsWith("q:")){ const q=Q_POR_ID[k.slice(2)], S=SEC_Q.find(x=>GUIAO[x.k].includes(q)), C=R.chk[q.id], sl=pp.addSlide(); cab(sl,S.t,q.t);
      const fr=(FREQ_Q.find(f=>f[0]===C.freq)||[])[1], L=[]; C.op.forEach(o=>L.push([o,{bullet:true,bold:true}])); if(fr) L.push([`Frequência: ${fr}`,{color:"6B675E"}]);
      C.jog.forEach(id=>{ const j=m.get(id); if(j) L.push([`${C.jp&&C.jp[id]?C.jp[id]+" · ":""}${j.n?j.n+" ":""}${j.nome}`,{bullet:true}]); }); if(C.nota) L.push([C.nota,{italic:true,color:"6B675E"}]);
      const qd=q.quadro&&temQuadro(C.quadro); lista(sl,L,.5,1.5,qd?6:12.3,5.6);
      if(qd){ try{ const P=await svgPng(svgQuadro(R,C.quadro,q.quadro==="meio")), mh=5.7, mw=6, r=P.w/P.h, w=Math.min(mw,mh*r), h=w/r; sl.addImage({data:sem(P.url),x:6.8+(mw-w)/2,y:1.45,w,h}); }catch(er){} }
      R.evid.filter(e=>e.q===q.id).forEach(e=>clip(S.t,q.t,e)); continue; }
    if(k.startsWith("bp:")){ const B=R.bp.find(b=>"bp:"+b.id===k); if(!B) continue; const g=B.lado==="of"?"Bolas paradas ofensivas":"Bolas paradas defensivas", sl=pp.addSlide(); cab(sl,g,nomeBp(B));
      const L=[]; BP_ASP.forEach(([a,t])=>{ if(B.asp[a]){ L.push([t,{bold:true}]); L.push([B.asp[a],{}]); } }); lista(sl,L,.5,1.5,temQuadro(B)?5.3:12.3,5.6);

      const L=[]; const pa=x.papeis.map(a=>PAPEIS[a]).filter(Boolean); if(pa.length) L.push([pa.join(", "),{bold:true}]); if(x.fortes) L.push([x.fortes,{}]); lista(sl,L,.5,1.5,12.3,5.6);
      R.evid.filter(e=>e.q==="jogd:"+x.id).forEach(e=>clip("Jogador de referência",`${x.nome} · dificuldade`,e)); continue; }

      lista(sl,[["Ameaças",{bold:true,color:"C00000"}],...A.map(t=>[t,{bullet:true}])],.5,1.5,6,5.6); lista(sl,[["Oportunidades",{bold:true,color:"1E7A46"}],...O.map(t=>[t,{bullet:true}])],6.8,1.5,6,5.6); } }

function svgPt(svg,e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse()); return {x:q.x/K,y:q.y/K}; }
const COR={sca:"#C00000",gr:"#FFFF00",out:"#7F7F7F"};
/* cores do equipamento dos adversários, confirmadas pelo Rodrigo Fonte (26/10/2026); o observador muda-as no relatório */
const CORES_EQ={"Barreiro":{cam:"#C8102E",cam2:"#FFFFFF"},"Lusitânia":{cam:"#118C3E",cam2:"#FFFFFF"},"Madalena":{cam:"#7B1E30",cam2:"#0055A4"},"Praiense":{cam:"#C8102E",cam2:"#1B1A17"},
  "Rabo de Peixe":{cam:"#0055A4",cam2:"#0055A4"},"Santo António":{cam:"#0055A4",cam2:"#FFFFFF"},"São Roque":{cam:"#FFD100",cam2:"#0055A4"},"União Micaelense":{cam:"#000000",cam2:"#000000"},"Vale Formoso":{cam:"#000000",cam2:"#FFFFFF"}};
const SEM_COR="#8C8C8C";
function contraste(h){ const m=String(h||"").match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); if(!m) return "#fff"; const [r,g,b]=m.slice(1).map(x=>parseInt(x,16)/255); return .2126*r+.7152*g+.0722*b>.6?"#000":"#fff"; }
function corEq(R){ const c=R.cores||{}, cam=c.cam||SEM_COR, gr=c.gr||"#FFFF00"; return {cam,cam2:c.cam2||"#000000",num:c.num||contraste(cam),gr,grNum:contraste(gr),definida:!!c.cam}; }
/* nome curto por baixo da bolinha: primeiro e último nome */
const nomeCurto=n=>{ const p=String(n||"").trim().split(/\s+/).filter(Boolean); return (p.length>1?p[0]+" "+p[p.length-1]:p[0]||"").slice(0,18); };
/* t = tamanho (1 = normal; nas bolas paradas as bolinhas são mais pequenas); a zona de toque nunca fica abaixo de ~26 */
function peca(x,y,txt,cor,fg,extra,borda,t=1,leg){ const r=19*t, fs=(txt.length<=2?17:txt.length===3?13.5:11)*Math.max(t,.8), b=borda&&!/^#0{3,6}$/i.test(borda);
  return `<g ${extra||""}>${b?`<circle cx="${x*K}" cy="${y*K}" r="${r+1.8*t}" fill="#000"/>`:""}<circle cx="${x*K}" cy="${y*K}" r="${r}" fill="${cor}" stroke="${b?borda:"#000"}" stroke-width="${(b?3.2:1.4)*t}"/>`+
    `<text x="${x*K}" y="${y*K+fs*.35}" text-anchor="middle" font-size="${fs}" font-weight="700" font-family="Roboto Condensed,Arial Narrow,Arial,sans-serif" fill="${fg}" pointer-events="none">${esc(txt)}</text>${leg?`<text x="${x*K}" y="${y*K+r+17}" text-anchor="middle" font-size="15" font-weight="700" font-family="Roboto Condensed,Arial Narrow,Arial,sans-serif" fill="#1B1A17" stroke="#fff" stroke-width="4" paint-order="stroke" pointer-events="none">${esc(leg)}</text>`:""}<circle cx="${x*K}" cy="${y*K}" r="${Math.max(26,38*t)}" fill="transparent"/></g>`; }
function bolaSvg(x,y,extra){ return `<g ${extra||""}><image href="{{BOLA}}" x="${x*K-10}" y="${y*K-10}" width="20" height="20" pointer-events="none"/><circle cx="${x*K}" cy="${y*K}" r="34" fill="transparent"/></g>`; }
const posAdv=(sis,i)=>{ const b=(SISTEMAS[sis]||SISTEMAS["4-4-2"])[i]||["",52,34]; return {x:b[2],y:105-b[1],pos:b[0]}; };
const posNos=i=>{ const b=SISTEMAS["3-4-3"][i]; return {x:68-b[2],y:b[1],pos:b[0]}; };
/* durante um arrasto, o que chega da base de dados espera: redesenhar a meio soltava a bolinha */
let aArrastar=false;
function fimArrasto(){ aArrastar=false; if(precisaRender) setTimeout(()=>{ if(!aArrastar&&!aEscrever()&&precisaRender){ precisaRender=false; render.mesma=true; render(); } },0); }
function arrasta(svg,{onDown,onMove,onUp}){ let ativo=null;
  svg.addEventListener("pointerdown",e=>{ const r=onDown(e,svgPt(svg,e)); if(r){ ativo=r; aArrastar=true; e.preventDefault(); try{ svg.setPointerCapture(e.pointerId); }catch(x){} } });
  svg.addEventListener("pointermove",e=>{ if(!ativo) return; e.preventDefault(); onMove(ativo,svgPt(svg,e)); });
  const fim=e=>{ if(!ativo) return; const a=ativo; ativo=null; aArrastar=false; onUp(a,svgPt(svg,e)); fimArrasto(); }; svg.addEventListener("pointerup",fim); svg.addEventListener("pointercancel",fim); }
/* seta a ser desenhada: só a linha provisória muda, o campo fica (refazê-lo a cada movimento perdia o arrasto) */
function setaTmp(svg,html){ const v=svg.querySelector("[data-tmp]"); if(v) v.remove(); svg.insertAdjacentHTML("beforeend",html); }

let precisaRender=false;
function aEscrever(){ const a=document.activeElement; return a&&$("main").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName); }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(precisaRender&&!aEscrever()&&!aArrastar){ precisaRender=false; render(); } },60));
/* um erro a desenhar nunca deixa a página em branco: mostra o aviso e o caminho de volta */
function render(){ try{ render0(); }catch(e){ console.error(e); $("fab").hidden=true;
  $("main").innerHTML=`<div class="banner"><span>⚠</span><span><b>Não foi possível mostrar esta página.</b> Os dados estão guardados. <button class="btn sm" id="err-v">Voltar aos relatórios</button></span></div>`;
  $("err-v").onclick=()=>{ vista={tipo:"lista",id:null,sec:"ficha"}; guardaVista(); try{ render0(); }catch(x){ console.error(x); } }; } }
function render0(){ if(vista.tipo==="base"&&!bases[vista.id]){ const eq=EQUIPAS.find(([n])=>slugEq(n)===vista.id); if(eq) bases[vista.id]=baseNova(eq[0]); }
  const R=relAtual(); if((vista.tipo==="rel"||vista.tipo==="base")&&!R){ vista={tipo:"lista",id:null,sec:"ficha"}; }
  $("fab").hidden=vista.tipo!=="rel"||!podeEditar(relAtual()); guardaVista();
  const sy=scrollY; vista.tipo==="rel"?renderRel(relAtual()):vista.tipo==="base"?renderBase(relAtual()):vista.tipo==="hist"?renderHist(vista.id):renderLista(); if(render.mesma) scrollTo(0,sy); render.mesma=false; }
/* plantel base de uma equipa: só a secção Plantel, sem relatório */

    <p class="hint" style="margin:-4px 0 12px;max-width:72ch">${ed?"O plantel de partida dos relatórios novos desta equipa. Quem observa pode mudá-lo; os relatórios já começados não mudam.":"Plantel base (só leitura). Os relatórios novos desta equipa começam com ele."}</p>

function contagens(R){ const resp=TODAS_Q.filter(q=>respondida(R,q.id)).length, tot=TODAS_Q.length;

function renderLista(){ const ls=Object.values(rels).sort((a,b)=>String(b.atualizadoEm||b.criadoEm).localeCompare(String(a.atualizadoEm||a.criadoEm)));

  const estDe=R=>{ const rv=revs[R.id]; return rv&&rv.revisto?["rev","Revisto"]:R.estado==="env"?["env","Submetido"]:["rasc","Em curso"]; };
  const linhaJogo=R=>{ const c=contagens(R), e=estDe(R), np=nPendR(R);

      return `<button class="ev" data-id="${esc(R.id)}" style="grid-template-columns:minmax(0,1fr) auto;align-items:center"><span class="tx"><b>${esc(tituloJogo(R))}</b><br><span class="hint">${up&&ue?`Última alteração: ${esc(nomeDe(up,ul&&ul.nome))}, ${esc(new Date(ue).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}))}<br>`:""}${c.resp}/${c.tot} perguntas · ${c.ev} evidências${np?` · <span style="color:var(--warn)">⚠ ${np} por confirmar</span>`:""}${R.autor!==meId?" · "+esc(nomes[R.autor]||"Observador"):""}</span></span><span class="chip ${e[0]}">${e[1]}</span></button>`; };
  const cartaoEq=(n,ilha,rs)=>`<div class="rcard"${rs.length?"":' style="box-shadow:none;background:var(--surface-2);border-style:dashed"'}><div class="row" style="justify-content:space-between;width:100%"><span class="hint">${esc(ilha||"")}</span>${rs.length>1?`<button type="button" class="btn sm ghost" data-hist="${esc(n)}">📈 Histórico</button>`:""}</div>
      <h3>${esc(n||"Adversário por definir")}</h3>${rs.length?`<div class="evs">${rs.slice().reverse().map(linhaJogo).join("")}</div>`:`<div class="meta">Ainda sem jogos observados</div>`}
      ${!soLeitura&&n?`<button type="button" class="btn sm${rs.length?"":" primary"}" data-novo="${esc(n)}" style="align-self:flex-start">+ ${rs.length?"Novo jogo":"Começar observação"}</button>`:""}</div>`;

  EQUIPAS.forEach(([n,ilha])=>{ h+=cartaoEq(n,ilha,jogosDe(n)); });

  /* planteis base: mexer no plantel de cada equipa sem começar um relatório */
  h+=`<div class="row" style="justify-content:space-between;margin:0 0 10px"><h3 style="font-size:19px">Planteis base</h3><span class="hint">${!soLeitura?"Mexe no plantel de cada equipa sem começar um relatório; os relatórios novos partem dele.":"Planteis de partida dos relatórios novos."}</span></div>
    <div class="row" style="margin-bottom:22px">${EQUIPAS.map(([n])=>{ const B=bases[slugEq(n)]; return `<button class="btn" data-base="${slugEq(n)}">${esc(n)}${B&&B.atualizadoEm?`<span class="hint" style="font-weight:400"> · ${B.plantel.length}</span>`:""}</button>`; }).join("")}</div>`;
  const outros=ls.filter(R=>!EQUIPAS.some(([n])=>n===R.adversario));

  if(false) h+=`<div class="empty"><b>Ainda não há relatórios.</b><span>Cria um relatório por adversário. Dentro dele tens o guião de perguntas, o campo para a estrutura, as bolas paradas, os jogadores de referência e a síntese final. No estádio, usa o botão <b>+ Nota</b> para registar depressa e arrumar depois.</span>${!soLeitura?`<button class="btn primary" id="novo2">+ Criar o primeiro relatório</button>`:""}</div>`;
  $("main").innerHTML=h;
  const cria=adv=>{ const R=novoRelJogo(adv); guardaRel(R,true); gravaLog(R,{cam:["relatorio"],antes:null,depois:R.adversario||"",tipo:"criação"}); if(db&&meId) gravaDoc(`obs/${meId}`,{ativo:true}); vista={tipo:"rel",id:R.id,sec:"ficha"}; render(); scrollTo(0,0); };
  [$("novo"),$("novo2")].forEach(b=>b&&(b.onclick=()=>cria(""))); $("main").querySelectorAll("[data-novo]").forEach(b=>b.onclick=()=>cria(b.dataset.novo));

  $("main").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{ vista={tipo:"rel",id:b.dataset.id,sec:"ficha"}; bpAberto=null; jogAberto=null; render(); scrollTo(0,0); });
  $("main").querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>{ vista={tipo:"hist",id:b.dataset.hist,sec:"ficha"}; render(); scrollTo(0,0); });
  carregaNomes([...ls.map(r=>r.autor),...ls.map(r=>r.ultPor).filter(Boolean),...Object.values(logs).map(l=>l.por)]); }
function bannerAcesso(){ if(soLeitura) return `<div class="banner" style="margin-bottom:12px"><span>🔒</span><span><b>Sem permissão para gravar.</b> Pede à equipa técnica acesso de <b>Editor</b> a esta página.</span></div>`;
  if(semDb) return `<div class="banner" style="margin-bottom:12px"><span>⚠</span><span><b>Sem ligação à base de dados.</b> O que registares fica só neste aparelho até a ligação voltar a funcionar.</span></div>`; return ""; }

function renderRel(R){ const ed=podeEditar(R), c=contagens(R), rv=revs[R.id]; if(vista.sec==="bp") vista.sec="bpo";
  const cont=s=>{ if(s.q){ const qs=GUIAO[s.k]; return `${qs.filter(q=>respondida(R,q.id)).length}/${qs.length}`; } if(s.lado) return R.bp.filter(b=>b.lado===s.lado).length||""; if(s.k==="jog") return R.refs.length||""; if(s.k==="ficha") return R.jogos.length||""; if(s.k==="plantel") return R.plantel.length||""; if(s.k==="notas") return c.soltas||""; if(s.k==="hlog") return Object.values(logs).filter(l=>l.relId===R.id).length||""; return ""; };
  let nav="", g=""; SECS.forEach(s=>{ if(s.g!==g){ g=s.g; nav+=`<div class="grp">${esc(g)}</div>`; } const np=nPendSec(R,s); nav+=`<button data-s="${s.k}" aria-current="${s.k===vista.sec}">${esc(s.t)}<span class="c"${s.k==="notas"&&c.soltas?' style="color:var(--warn)"':""}>${np?`<span style="color:var(--warn)">⚠${np}</span> `:""}${cont(s)}</span></button>`; });
  const est=rv&&rv.revisto?`<span class="chip rev">Revisto</span>`:R.estado==="env"?`<span class="chip env">Submetido</span>`:`<span class="chip rasc">Em curso</span>`;
  $("main").innerHTML=`${bannerAcesso()}<div class="rhead"><button class="btn sm ghost" id="voltar" aria-label="Voltar aos relatórios">← Relatórios</button><h2>${esc(R.adversario||"Adversário por definir")} <span class="hint" style="font-family:var(--f-body);font-size:16px;font-weight:600">${esc(tituloJogo(R))}</span></h2>${est}<div class="sp">${souDono&&R.autor!==meId?`<span class="hint">Observador: ${esc(nomes[R.autor]||"—")}</span>`:""}<button type="button" class="btn sm" id="ex-pdf">📄 PDF</button><button type="button" class="btn sm" id="ex-ppt">📽 Apresentação</button></div></div>
    ${rv&&rv.texto&&vista.sec!=="sint"?`<div class="banner info" style="margin-bottom:12px"><span>💬</span><span><b>Revisão da equipa técnica:</b> ${esc(rv.texto).slice(0,240)}${rv.texto.length>240?"…":""} <a href="#" id="verrev">Ver na Síntese</a></span></div>`:""}
    ${nPendR(R)&&ed?`<div class="banner pendb" style="margin-bottom:12px"><span>⚠</span><span style="flex:1"><b>${nPendR(R)} ${nPendR(R)===1?"ponto vem":"pontos vêm"} do jogo anterior${esc(vemDe(R))}</b> e ${nPendR(R)===1?"está":"estão"} por confirmar (a laranja). Confirma o que se mantém e muda o que for diferente.</span><button type="button" class="btn sm" id="pend-tudo">Confirmar tudo</button></div>`:""}

  $("voltar").onclick=()=>{ vista={tipo:"lista",id:null,sec:"ficha"}; render(); scrollTo(0,0); };
  $("ex-pdf").onclick=()=>exportaPdf(R,$("ex-pdf")); $("ex-ppt").onclick=()=>folhaApresentacao(R);

/* um campo grava ao perder o foco (ao tocar noutro sítio); redesenhar a meio desse toque fazia perder o botão tocado (ex.: "← Relatórios" no Safari) */
let dedoEmBaixo=false;
document.addEventListener("pointerdown",()=>dedoEmBaixo=true,true); ["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>setTimeout(()=>dedoEmBaixo=false,0),true));
function depoisDoToque(fn){ if(dedoEmBaixo) document.addEventListener("pointerup",()=>setTimeout(fn,0),{once:true}); else setTimeout(fn,0); }
/* ligação genérica dos campos de texto: data-b="caminho.no.relatorio" (listas por id) */
function getP(o,p){ return p.split(".").reduce((a,k)=>a==null?a:Array.isArray(a)&&!/^\d+$/.test(k)?a.find(x=>x.id===k):a[k],o); }
function setP(o,p,v){ const ks=p.split("."), last=ks.pop(); const t=ks.reduce((a,k)=>{ let n=Array.isArray(a)&&!/^\d+$/.test(k)?a.find(x=>x.id===k):a[k]; if(n==null){ n={}; a[k]=n; } return n; },o); t[last]=v; }
function liga(box,R,ed){ box.querySelectorAll("[data-b]").forEach(el=>{ const v=getP(R,el.dataset.b); if(el.type==="checkbox") el.checked=!!v; else el.value=v==null||v===""?(el.dataset.def||""):v; if(!ed){ el.readOnly=true; if(el.tagName==="SELECT") el.disabled=true; return; }
    const on=()=>{ const Rr=relAtual(); if(!Rr) return; let v=el.type==="checkbox"?el.checked:el.value; if(el.dataset.min!=null) v=minNorm(v); setP(Rr,el.dataset.b,v); const pk=pendDeCaminho(el.dataset.b); if(pk&&tiraPend(Rr,pk)) document.querySelectorAll(`[data-pconf="${pk}"]`).forEach(x=>{ const b=x.closest(".pendb"); if(b) b.remove(); }); guardaRel(Rr); };
    el.addEventListener(el.tagName==="SELECT"||el.type==="checkbox"?"change":"input",on); if(el.dataset.min!=null) el.addEventListener("change",()=>{ el.value=minNorm(el.value); on(); });
    if(el.dataset.rr!=null) el.addEventListener("change",()=>depoisDoToque(()=>{ const a=document.activeElement, k=a&&a.dataset&&a.dataset.b; render.mesma=true; render(); if(k){ const n=$("main").querySelector(`[data-b="${CSS.escape(k)}"]`); if(n) n.focus(); } })); });
  box.querySelectorAll("textarea").forEach(t=>{ const a=()=>{ t.style.height="auto"; t.style.height=Math.max(70,t.scrollHeight+2)+"px"; }; a(); t.addEventListener("input",a); }); }

/* ---------- evidências ---------- */
function jogoDe(R,id){ return R.jogos.find(j=>j.id===id); }
function jogoCurto(J){ return J?(J.vs?"vs "+J.vs:"Jogo")+(J.data?" · "+dataPt(J.data):""):""; }

    ${ed?`<button class="btn sm addev" data-addev="${esc(q)}">+ Evidência</button>`:""}`; }
function ligaEv(box,R){ box.querySelectorAll("[data-ev]").forEach(b=>b.onclick=e=>{ if(e.target.closest("[data-lk]")) return; folhaEv(b.dataset.ev); });
  box.querySelectorAll("[data-addev]").forEach(b=>b.onclick=()=>folhaEv(null,b.dataset.addev)); }
function opcPerguntas(R,q){ let h=`<option value="">Por arrumar</option>`; SEC_Q.forEach(s=>{ h+=`<optgroup label="${esc(s.t)}">`+GUIAO[s.k].map((x,i)=>`<option value="${x.id}"${q===x.id?" selected":""}>${i+1}. ${esc(x.t.length>70?x.t.slice(0,68)+"…":x.t)}</option>`).join("")+`</optgroup>`; });

function folhaEv(id,q0,rapida){ const R=relAtual(); if(!R) return; const ed=podeEditar(R); const E0=id?R.evid.find(e=>e.id===id):null; if(id&&!E0) return;
  const E=E0?clone(E0):{id:nid("e"),q:q0||"",txt:"",jogo:(R.jogos[R.jogos.length-1]||{}).id||"",min:"",freq:rapida?"conf":"rec",ctx:"",clip:false,sit:"",criadoEm:new Date().toISOString()};
  const qTxt=q=>(Q_POR_ID[q]||{}).t||"";
  folha(`<h3>${rapida?"Nota rápida":E0?"Evidência":"Nova evidência"}</h3>
    <label class="f">Onde fica<select id="e-q" ${ed?"":"disabled"}>${opcPerguntas(R,E.q)}</select></label><p class="hint" id="e-qt" style="margin:-4px 0 0"></p>

    <div class="fields"><label class="f">Jogo<select id="e-j" ${ed?"":"disabled"}><option value="">Sem jogo associado</option>${R.jogos.map(j=>`<option value="${esc(j.id)}"${j.id===E.jogo?" selected":""}>${esc(jogoCurto(j))}</option>`).join("")}</select></label>
    <label class="f">Minuto do vídeo (mm:ss)<input type="text" id="e-m" inputmode="numeric" placeholder="23:10" value="${esc(E.min)}" ${ed?"":"readonly"}></label></div>
    <h4>Frequência</h4><div class="seg" id="e-f"></div>
    <h4>Resultado no momento</h4><div class="seg" id="e-c" data-toggle="1"></div>
    <label class="row" style="gap:10px;font-size:14.5px;min-height:40px"><input type="checkbox" id="e-clip" style="width:20px;height:20px" ${E.clip?"checked":""} ${ed?"":"disabled"}> 🎬 Bom exemplo para clip</label>
    <div class="actions">${E0&&ed?`<button class="btn danger l" id="e-del">Apagar</button>`:""}<button class="btn" data-close>${ed?"Cancelar":"Fechar"}</button>${ed?`<button class="btn primary" id="e-ok">Guardar</button>`:""}</div>`,(s,fecha)=>{
    const sq=s.querySelector("#e-q"), sw=s.querySelector("#e-sitw");
    const upd=()=>{ s.querySelector("#e-qt").textContent=qTxt(sq.value); sw.hidden=!sq.value.startsWith("jogd:"); }; sq.onchange=upd; upd();

const PLF={VW:1680,fx:40,fy:80,fw:1600,fh:1120,bw:236};
function posicoesPx(lay,cont,xy){ const {fx,fy,fw,fh,bw}=PLF, P={}, ord=lay.slice().sort((a,b)=>a[3]-b[3]); let fundo=fy+fh; xy=xy||{};
  /* bolinhas que o observador pôs à mão ficam onde as pôs; as outras seguem o sistema sem se sobreporem */
  ord.forEach(([c])=>{ const q=xy[c]; if(!q) return; P[c]={x:fx+q.x*fw,y:fy+q.y*fh,livre:true}; fundo=Math.max(fundo,P[c].y+34+Math.max(1,cont[c]||0)*44+16); });
  ord.forEach(([c,,px,py])=>{ if(P[c]) return; const x=fx+px*fw; let y=fy+py*fh;
    ord.forEach(([c2])=>{ const q=P[c2]; if(q&&!q.livre&&Math.abs(q.x-x)<bw+8){ const fim=q.y+34+Math.max(1,cont[c2]||0)*44; if(fim+40>y) y=fim+40; } });
    P[c]={x,y}; fundo=Math.max(fundo,y+34+Math.max(1,cont[c]||0)*44+16); });
  return {P,fh:Math.max(fh,fundo-fy)}; }

  const nf=Math.round(fh2/(fh/10)); for(let i=0;i<nf;i++) h+=`<rect x="${fx}" y="${fy+i*fh2/nf}" width="${fw}" height="${fh2/nf}" fill="${i%2?"#F1F1F1":"#FAFAFA"}"/>`;

  h+=`<rect x="${cx-20.16*kx}" y="${fy}" width="${40.32*kx}" height="${16.5*ky}" ${L}/><rect x="${cx-9.16*kx}" y="${fy}" width="${18.32*kx}" height="${5.5*ky}" ${L}/>`;
  h+=`<path d="M ${cx-7.31*kx} ${fy+16.5*ky} A ${9.15*kx} ${9.15*ky} 0 0 0 ${cx+7.31*kx} ${fy+16.5*ky}" ${L}/><path d="M ${cx-9.15*kx} ${fy+fh2} A ${9.15*kx} ${9.15*ky} 0 0 1 ${cx+9.15*kx} ${fy+fh2}" ${L}/>`;
  const caixa=(x,y,j,w,attr)=>{ const t=(j.nome||"?")+(R.capitao===j.id?" (C)":""), lab=(j.n?j.n+"  ":"")+t, fs=23, lim=w-16, cw=lab.length*fs*.5, conf=O?true:j.conf;

    const nomeOnze=(bx,by)=>{ const j=grupos[c][0]; return j?caixa(bx,by,j,bw,`data-os="${c}"`):`<g data-os="${c}" data-bx="${Math.round(bx)}" data-by="${Math.round(by)}" style="cursor:pointer;touch-action:none"><rect x="${bx-bw/2}" y="${by}" width="${bw}" height="38" rx="5" fill="#fff" stroke="#B9B4AA" stroke-width="3" stroke-dasharray="9 6"/><text x="${bx}" y="${by+27}" text-anchor="middle" font-size="21" font-family="${F}" fill="#8A857B">Escolher</text></g>`; };
    if(O){ const q=nl[c]; if(q) soltos.push(()=>nomeOnze(fx+q.x*fw,fy+q.y*fh)); else h+=nomeOnze(x,y+34); }

  /* nomes soltos por cima, fora dos grupos (não andam com a bolinha) */

    <p class="hint" style="margin-top:6px">Nas dificuldades, exemplos concretos: em vez de “o lateral defende mal”, em que situação tem dificuldade. O objetivo é encontrar situações que possamos provocar no jogo.</p></header>
    ${ed?`<div><button class="btn primary" id="jg-add">+ Jogador</button></div>`:""}
    ${R.refs.length?R.refs.map(p=>{ const ab=jogAberto===p.id, nd=R.evid.filter(e=>e.q==="jogd:"+p.id).length; return `<div class="card pl"><button class="bpi" data-jg="${esc(p.id)}" aria-expanded="${ab}" style="border:0;padding:0;min-height:44px"><span class="plh" style="margin:0"><span class="num">${esc(p.n||"–")}</span><b>${esc(p.nome||"Sem nome")}${p.pos?" · "+esc(p.pos):""}</b>${R.pend&&R.pend["ref:"+p.id]?`<span class="chip env">⚠ por confirmar</span>`:""}</span><span>${p.papeis.map(k=>PAPEIS[k]).filter(Boolean).join(", ")}${nd?` · ${nd} ${nd===1?"dificuldade":"dificuldades"}`:""} ${ab?"▴":"▾"}</span></button>
      ${ab?`${R.plantel.length?`<label class="f">Jogador do plantel<select data-refj="${esc(p.id)}" ${ed?"":"disabled"}>${opJog(R,p.jid||"")}</select></label>`:""}${bannerPend(R,"ref:"+p.id,ed,"Este jogador de referência vem do jogo anterior")}<div class="fields"><label class="f">Número<input type="text" data-b="refs.${p.id}.n" data-rr inputmode="numeric"></label><label class="f">Nome<input type="text" data-b="refs.${p.id}.nome" data-rr></label><label class="f">Posição<input type="text" data-b="refs.${p.id}.pos" data-rr></label></div>
        <div><h4 style="margin-bottom:6px">Papel na equipa</h4><div class="seg" data-pap="${esc(p.id)}">${Object.entries(PAPEIS).map(([k,v])=>`<button type="button" data-k="${k}" aria-pressed="${p.papeis.includes(k)}"${ed?"":" disabled"}>${v}</button>`).join("")}</div></div>
        <label class="f">O que faz bem e como influencia o jogo${p.papeis.includes("gr")?" (construção, controlo do espaço nas costas)":""}<textarea data-b="refs.${p.id}.fortes" rows="3"></textarea></label>
        <div><h4 style="margin-bottom:6px">Dificuldades em situações concretas</h4>${listaEv(R,"jogd:"+p.id,ed).replace("+ Evidência","+ Dificuldade")}</div>
        ${ed?`<div class="actions"><button class="btn danger l" data-jgdel="${esc(p.id)}">Apagar jogador</button></div>`:""}`:""}</div>`; }).join(""):`<div class="empty"><b>Sem jogadores de referência.</b><span>Acrescenta aqui, ou toca num jogador no separador Estrutura e escolhe “+ Jogador de referência”.</span></div>`}`;
  box.querySelectorAll("[data-jg]").forEach(b=>b.onclick=()=>{ jogAberto=jogAberto===b.dataset.jg?null:b.dataset.jg; render.mesma=true; render(); });
  ligaEv(box,R);
  if(!ed) return;
  $("jg-add").onclick=()=>folhaRefPlantel();
  box.querySelectorAll("[data-refj]").forEach(sel=>sel.onchange=()=>{ const id=sel.dataset.refj, j=R.plantel.find(x=>x.id===sel.value); if(!j) return; const sis=R.sistema||"4-3-3";
    editaRel(R=>{ const p=R.refs.find(x=>x.id===id); if(!p) return; p.jid=j.id; p.n=j.n||""; p.nome=j.nome; p.pos=posNoSis(j.slot,sis)||""; if(p.pos==="GR"&&!p.papeis.includes("gr")) p.papeis.push("gr"); }); });
  box.querySelectorAll("[data-pap]").forEach(w=>w.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const id=w.dataset.pap, k=b.dataset.k; editaRel(R=>{ const p=R.refs.find(x=>x.id===id); p.papeis=p.papeis.includes(k)?p.papeis.filter(x=>x!==k):[...p.papeis,k]; },true); b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"); }));
  box.querySelectorAll("[data-jgdel]").forEach(b=>confirma2(b,"Toca outra vez para apagar",()=>{ const id=b.dataset.jgdel; editaRel(R=>{ R.refs=R.refs.filter(x=>x.id!==id); R.evid.forEach(e=>{ if(e.q==="jogd:"+id) e.q=""; }); }); })); }

/* histórico de alterações do relatório: mais recente primeiro, filtro por pessoa; o dono pode repor */
const nomeDe=(uid,fb)=>uid===meId&&meuNome?meuNome:nomes[uid]||fb||(uid===meId?"Eu":"Alguém");
let hlogPor="";
function secHlog(R,box,ed){ const ls=Object.values(logs).filter(l=>l.relId===R.id).sort((a,b)=>String(b.em).localeCompare(String(a.em))), pess=[...new Set(ls.map(l=>l.por))]; carregaNomes(pess);
  const vis=hlogPor?ls.filter(l=>l.por===hlogPor):ls, dh=e=>new Date(e.em).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  box.innerHTML=`<header><h3>Histórico de alterações</h3><p>Quem mudou o quê neste relatório, do mais recente para o mais antigo. Alterações seguidas ao mesmo campo pela mesma pessoa (10 minutos) contam como uma.</p></header>
    ${pess.length>1?`<div class="seg" id="hl-por"></div>`:""}
    <div class="evs">${vis.map(e=>`<div class="ev" style="grid-template-columns:minmax(0,1fr) auto;align-items:start"><span class="tx"><b>${esc(nomeDe(e.por,e.nome))}</b> · ${esc(dh(e))}${e.tipo!=="edição"?` <span class="chip ${e.tipo==="reposição"?"env":"rasc"}">${esc(e.tipo)}</span>`:""}<br><span class="hint">${esc([e.sec,e.campo].filter(Boolean).join(" › "))}</span><br>${esc(resumoLog(R,e))}</span>
      ${souDono&&!soLeitura&&e.cam[0]!=="relatorio"?`<button type="button" class="btn sm" data-repor="${esc(e.id)}">Repor</button>`:""}</div>`).join("")||`<p class="hint">Ainda sem alterações registadas.</p>`}</div>`;
  if(pess.length>1) seg($("hl-por"),[["","Todos"],...pess.map(u=>[u,nomeDe(u,(ls.find(l=>l.por===u)||{}).nome)])],hlogPor,v=>{ hlogPor=v; render.mesma=true; render(); });
  box.querySelectorAll("[data-repor]").forEach(b=>confirma2(b,"Toca outra vez para repor",()=>{ const e=logs[b.dataset.repor]; if(!e) return;
    proxTipo="reposição"; editaRel(R=>{ if(!poeCaminho(R,e.cam,e.antes)) toast("Já não é possível repor este valor."); },true); proxTipo=null; render.mesma=true; render(); toast("Valor reposto"); })); }
function secSint(R,box,ed){ const rv=revs[R.id]||{}, cand=R.evid.filter(e=>e.clip&&!R.clips.some(c=>c.ev===e.id));
  box.innerHTML=`<header><h3>Síntese</h3><p>Distingue o que é recorrente, o que apareceu pontualmente e o que ainda precisa de confirmação. Considera o resultado e o contexto de cada jogo.</p></header>${bannerPend(R,"sint",ed,"A síntese vem do jogo anterior")}
  <div class="card"><h4>1. Estrutura e comportamentos principais</h4><textarea data-b="sint.estrutura" rows="4"></textarea></div>
  <div class="card"><h4>2. Três ameaças que precisamos de controlar</h4><div class="three">${[0,1,2].map(i=>`<div><b>${i+1}</b><textarea data-b="sint.ameacas.${i}" rows="2"></textarea></div>`).join("")}</div></div>
  <div class="card"><h4>3. Três oportunidades que podemos explorar</h4><div class="three op">${[0,1,2].map(i=>`<div><b>${i+1}</b><textarea data-b="sint.oport.${i}" rows="2"></textarea></div>`).join("")}</div></div>
  <div class="card"><h4>4. Bolas paradas e jogadores de referência</h4><textarea data-b="sint.bpref" rows="4"></textarea></div>
  <div class="card"><h4>5. Clips</h4><p class="hint" style="margin:0">Clips curtos que sustentem as conclusões, cada um com uma frase a explicar o que devemos observar.</p>
    ${R.clips.map((c,i)=>{ const J=jogoDe(R,c.jogo), lk=linkVideo(J,c.ini); return `<div class="clip"><div class="fields" style="grid-column:1/-1"><label class="f">Jogo<select data-b="clips.${c.id}.jogo" data-rr><option value="">—</option>${R.jogos.map(j=>`<option value="${esc(j.id)}">${esc(jogoCurto(j))}</option>`).join("")}</select></label><label class="f">Início<input type="text" data-b="clips.${c.id}.ini" data-min data-rr placeholder="23:10"></label><label class="f">Fim<input type="text" data-b="clips.${c.id}.fim" data-min placeholder="23:40"></label></div>
      <label class="f" style="grid-column:1/-1">O que devemos observar<input type="text" data-b="clips.${c.id}.frase"></label><div class="row" style="grid-column:1/-1;justify-content:space-between">${lk?`<a href="${esc(lk)}" target="_blank" rel="noopener" class="btn sm">▶ Abrir no vídeo</a>`:"<span></span>"}${ed?`<button class="btn sm ghost" data-cdel="${esc(c.id)}">Apagar</button>`:""}</div></div>`; }).join("")}
    ${ed?`<div class="row"><button class="btn sm" id="c-add">+ Clip</button></div>`:""}
    ${ed&&cand.length?`<div><h4 style="margin:6px 0">Evidências marcadas como 🎬</h4><div class="evs">${cand.map(e=>`<div class="ev" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="tm">${esc(e.min||"—")}</span><span class="tx">${esc(e.txt)}</span><button class="btn sm" data-cev="${esc(e.id)}">Usar</button></div>`).join("")}</div></div>`:""}</div>
  <div class="card rev"><h4>Revisão da equipa técnica</h4>${souDono?`<textarea id="rv-t" rows="4" placeholder="Comentários para o observador: nível de detalhe, o que acrescentar, como apresentar.">${esc(rv.texto||"")}</textarea><label class="row" style="gap:10px;min-height:40px"><input type="checkbox" id="rv-ok" style="width:20px;height:20px" ${rv.revisto?"checked":""}> Relatório revisto</label>`
      :rv.texto?`<p style="margin:0;white-space:pre-wrap">${esc(rv.texto)}</p>${rv.revisto?`<span class="chip rev" style="align-self:flex-start">Revisto</span>`:""}`:`<p class="hint" style="margin:0">Ainda sem comentários. Quando submeteres o relatório, a equipa técnica deixa aqui as notas.</p>`}</div>`;
  if(souDono&&!soLeitura){ let t=null; const grava=()=>{ const v={texto:$("rv-t").value,revisto:$("rv-ok").checked,em:new Date().toISOString()}; revs[R.id]=v; guardaCache(); gravaDoc(revPath(R),v); };
    $("rv-t").oninput=()=>{ clearTimeout(t); t=setTimeout(grava,700); }; $("rv-ok").onchange=()=>{ grava(); toast($("rv-ok").checked?"Marcado como revisto":"Revisão reaberta"); }; }
  if(!ed) return;
  $("c-add").onclick=()=>editaRel(R=>R.clips.push({id:nid("c"),jogo:(R.jogos[R.jogos.length-1]||{}).id||"",ini:"",fim:"",frase:""}));
  box.querySelectorAll("[data-cdel]").forEach(b=>confirma2(b,"Apagar?",()=>editaRel(R=>R.clips=R.clips.filter(c=>c.id!==b.dataset.cdel))));
  box.querySelectorAll("[data-cev]").forEach(b=>b.onclick=()=>editaRel(R=>{ const e=R.evid.find(x=>x.id===b.dataset.cev); const s=minSeg(e.min); R.clips.push({id:nid("c"),ev:e.id,jogo:e.jogo,ini:e.min,fim:s!=null?minNorm(Math.floor((s+20)/60)+":"+String((s+20)%60).padStart(2,"0")):"",frase:e.txt}); })); }

function secNotas(R,box,ed){ const ns=R.evid.filter(e=>!e.q);
  box.innerHTML=`<header><h3>Notas por arrumar</h3><p>As notas rápidas ficam aqui até as ligares a uma pergunta, a uma bola parada ou a um jogador. Toca numa nota para a arrumar.</p></header>
    ${ns.length?`<div class="card">${listaEv(R,"",ed).replace(/<button class="btn sm addev"[^>]*>[^<]*<\/button>/,"")}</div>`:`<div class="empty"><b>Tudo arrumado.</b><span>No estádio, usa o botão <b>+ Nota</b> para registar depressa. As notas aparecem aqui.</span></div>`}`;
  ligaEv(box,R); }

$("status").onclick=folhaEstado;
$("fab").onclick=()=>{ const S=SECS.find(s=>s.k===vista.sec); folhaEv(null,S&&S.q?"":"",true); };

/* ======================= nomes dos observadores ======================= */
async function carregaNomes(ids){ if(!usr) return; const falta=[...new Set(ids)].filter(i=>i&&i!=="local"&&!(i in nomes)); if(!falta.length) return;
  try{ const ps=await usr.profiles(falta); let mud=false; falta.forEach(i=>{ const n=(ps[i]&&ps[i].name)||""; if(nomes[i]!==n){ nomes[i]=n; mud=true; } }); if(mud&&!aEscrever()) render(); }catch(e){} }

/* ======================= arranque ======================= */
function carregaCache(){ const c=LS(CACHE); if(c){ revs=c.revs||{}; srvs=c.srvs||{}; Object.entries(c.rels||{}).forEach(([id,R])=>{ try{ rels[id]=normRel({...R,id}); }catch(e){} }); }
  Object.entries(LS(BASES)||{}).forEach(([s,B])=>{ try{ bases[s]=normBase({...B,equipa:B.equipa||B.adversario},s); }catch(e){} });
  const v=LS("sca-obs-vista"); if(v&&v.tipo) vista=v; }
carregaCache();
render(); estado();
(async()=>{
  try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ db=null; }
  try{ usr=await window.claude.use("user"); }catch(e){ usr=null; }
  if(usr){ try{ meId=await usr.id(); }catch(e){} try{ souDono=!!(await usr.isOwner()); }catch(e){} try{ if(await usr.can("data.write")===false&&!souDono){ /* as regras próprias decidem: tenta e, se recusar, fica só leitura */ } }catch(e){} }
  if(!db||!meId){ semDb=true; meId=meId||"local"; Object.values(rels).forEach(R=>{ if(!R.autor) R.autor=meId; }); estado(); render(); return; }
  /* relatórios criados sem ligação passam para o autor certo */
  Object.values(rels).forEach(R=>{ if(R.autor==="local"){ R.autor=meId; guardaRel(R,true); } });
  estado(); reenvia();
  const subs={};
  const ouveAutor=uid=>{ if(subs[uid]) return; subs[uid]=true;
    db.collection(`obs/${uid}/relatorios`).onSnapshot(q=>{ if(q.metadata?.hasPendingWrites) return; let mud=false; const vistos=new Set();
      q.docs.forEach(d=>{ const x=lerDoc(d); if(!x) return; vistos.add(d.id); const p=`obs/${uid}/relatorios/${d.id}`, rem=normRel({...x,id:d.id,autor:uid}), loc=rels[d.id], base=srvs[d.id], aqui=!!(pend[p]||tSave[d.id]);
        const R=!loc||!base&&!aqui?rem:normRel({...junta3(base?semMeta(base):undefined,semMeta(loc),semMeta(rem)),atualizadoEm:rem.atualizadoEm,id:d.id,autor:uid});
        srvs[d.id]=clone(rem); /* cópia à parte: o relatório no ecrã muda, a cópia do servidor não */ if(JSON.stringify(R)!==JSON.stringify(loc)){ rels[d.id]=R; mud=true; } });
      Object.values(rels).forEach(R=>{ if(R.autor===uid&&!vistos.has(R.id)&&!pend[relPath(R)]&&!q.metadata?.fromCache){ delete rels[R.id]; mud=true; } });
      if(mud){ guardaCache(); if(aEscrever()||aArrastar) precisaRender=true; else render(); } estado(); },e=>{ if(["revoked","unavailable","capability_disabled","capability_removed"].includes(e?.code)){ revogado=true; estado(); } });
    db.collection(`log/${uid}/e`).onSnapshot(q=>{ if(q.metadata?.hasPendingWrites) return; let mud=false;
      q.docs.forEach(d=>{ const x=lerDoc(d); if(!x||pend[`log/${uid}/e/${d.id}`]) return; const e={...x,id:d.id,cam:Array.isArray(x.cam)?x.cam.map(String):[]}; if(JSON.stringify(e)!==JSON.stringify(logs[d.id])){ logs[d.id]=e; mud=true; } });
      if(mud&&(vista.tipo==="lista"||vista.sec==="hlog")){ if(aEscrever()||aArrastar) precisaRender=true; else { render.mesma=true; render(); } } },()=>{}); };
  ouveAutor(meId);
  try{ meuNome=await usr.name()||""; }catch(e){}
  /* revisão da equipa técnica: toda a gente lê, só o dono escreve */
  db.collection("rev").onSnapshot(q=>{ if(q.metadata?.hasPendingWrites) return; let mud=false;
    q.docs.forEach(d=>{ const x=lerDoc(d); if(!x||pend[`rev/${d.id}`]) return; const v={texto:String(x.texto||""),revisto:!!x.revisto,em:x.em||""}; if(JSON.stringify(v)!==JSON.stringify(revs[d.id])){ revs[d.id]=v; mud=true; } });
    if(mud){ guardaCache(); if(aEscrever()||aArrastar) precisaRender=true; else render(); } },()=>{});
  /* planteis base: toda a gente lê, só o dono escreve */
  db.collection("base").onSnapshot(q=>{ if(q.metadata?.hasPendingWrites) return; let mud=false;
    q.docs.forEach(d=>{ const x=lerDoc(d); if(!x||pend[`base/${d.id}`]||tSave["base:"+d.id]) return; const B=normBase(x,d.id);
      if(JSON.stringify(B)!==JSON.stringify(bases[d.id])){ bases[d.id]=B; mud=true; } });
    if(mud){ guardaCacheBase(); if(aEscrever()||aArrastar) precisaRender=true; else render(); } },()=>{});
  /* toda a equipa de observação vê e edita os relatórios de todos; cada alteração fica no histórico */
  db.collection("obs").onSnapshot(q=>{ q.docs.forEach(d=>ouveAutor(d.id)); carregaNomes(q.docs.map(d=>d.id)); },()=>{});
  render();
})();
</script>
